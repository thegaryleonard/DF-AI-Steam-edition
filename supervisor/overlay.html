<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>The Fortress Herald</title>
<style>
  :root {
    --paper: #efe4cc; --paper2: #e3d4b2; --ink: #241c13; --ink2: #5a4a36; --rule: #3b2f22; --hair: #a8946c;
    --red: #8f2a1c; --green: #3f6b2e; --accent: #7a4b16;
    --black: "Old English Text MT", "UnifrakturMaguntia", Georgia, serif;
    --body: Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; width: 480px; overflow: hidden; background: transparent; font-family: var(--body); color: var(--ink); }
  .paper {
    margin: 6px; height: calc(100vh - 12px); min-height: 860px; padding: 8px 11px 8px;
    display: flex; flex-direction: column; overflow: hidden;
    background: radial-gradient(ellipse at 30% 20%, #f5ecd8 0%, var(--paper) 55%, var(--paper2) 100%);
    border: 1px solid #b9a57f; box-shadow: 0 6px 22px rgba(0,0,0,.55), inset 0 0 40px rgba(120,90,40,.18);
  }
  p { margin: 0; }
  .just { text-align: justify; hyphens: auto; -webkit-hyphens: auto; }

  /* masthead with ears */
  .mast { display: grid; grid-template-columns: 74px 1fr 74px; align-items: center; gap: 6px; }
  .ear { border: 1px solid var(--rule); padding: 2px 3px; font-size: 8.5px; line-height: 1.2; text-align: center; text-transform: uppercase; letter-spacing: .4px; color: var(--ink2); }
  .ear b { display: block; font-size: 11px; color: var(--ink); letter-spacing: 0; }
  .mast h1 { min-width: 0; overflow: hidden; margin: 0; text-align: center; font-family: var(--black); font-weight: normal; font-size: 37px; line-height: .95; white-space: nowrap; }
  .mast .the { display: block; font-size: 15px; }
  .motto { text-align: center; font-size: 9px; font-style: italic; color: var(--ink2); margin-top: 1px; }
  .issue { display: flex; justify-content: space-between; font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
           border-top: 3px double var(--rule); border-bottom: 1px solid var(--rule); padding: 2px 0; margin: 3px 0 5px; color: var(--ink2); }

  .kicker { font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--accent); border-bottom: 1px solid var(--rule); padding-bottom: 1px; margin-bottom: 3px; display: flex; justify-content: space-between; }
  .headline { font-size: 21px; font-weight: 900; line-height: 1.02; margin: 2px 0 3px; letter-spacing: -.2px; }
  .deck { font-style: italic; font-size: 12.5px; line-height: 1.25; color: var(--ink2); margin-bottom: 4px; }
  .body { font-size: 12.5px; line-height: 1.28; }
  .sub { font-size: 9.5px; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); margin: 4px 0 1px; }
  .line { font-size: 11.5px; line-height: 1.25; display: flex; justify-content: space-between; gap: 4px; }
  .line .lead { flex: 1; border-bottom: 1px dotted var(--hair); margin-bottom: 3px; }
  .dim { color: var(--ink2); }
  .dead { color: var(--red); }
  .fadein { animation: fadein .9s ease; } @keyframes fadein { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
  .bar { height: 5px; background: #d3c29c; border: 1px solid var(--hair); margin: 1px 0 3px; }
  .bar > div { height: 100%; }

  /* interview */
  .iv { font-size: 12.5px; line-height: 1.28; }
  .iv p { margin-bottom: 3px; }
  .iv .q { font-weight: 700; }
  .iv .who { font-variant: small-caps; font-weight: 700; letter-spacing: .3px; }
  .iv .q .who { color: var(--accent); }
  .vitals { float: right; width: 150px; margin: 2px 0 4px 9px; border: 1px solid var(--rule); padding: 3px 5px 2px; background: rgba(255,250,235,.35); }
  .vitals .sub { margin-top: 0; text-align: center; border-bottom: 1px solid var(--rule); }
  .pull { clear: both; margin: 4px 0 5px; padding: 3px 0; border-top: 2px solid var(--rule); border-bottom: 1px solid var(--rule);
          font-size: 15.5px; font-style: italic; font-weight: 700; line-height: 1.15; text-align: center; }
  .dropcap::first-letter { float: left; font-size: 34px; line-height: .8; padding: 3px 3px 0 0; font-weight: 900; }

  /* map / tables / archive */
  .mapwrap { position: relative; border: 1px solid var(--rule); box-shadow: inset 0 0 18px rgba(60,40,10,.35); }
  canvas { display: block; }
  .forecast { display: flex; justify-content: space-between; align-items: baseline; margin-top: 3px; font-size: 12px; }
  .forecast b { font-size: 15px; }
  table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  td { padding: 0; border-bottom: 1px dotted #b9a57f; line-height: 1.35; }
  td.n { text-align: right; width: 50px; font-variant-numeric: tabular-nums; }
  td.t { width: 16px; text-align: center; }
  td.b { width: 110px; padding-left: 6px; }
  .lvl { height: 5px; background: #d3c29c; }
  .lvl > div { height: 100%; background: var(--ink2); }
  .up { color: var(--green); } .down { color: var(--red); }
  .story div { font-size: 12px; line-height: 1.25; padding: 1px 0 1px 7px; border-left: 2px solid var(--hair); margin-bottom: 2px; }
  .yr { font-weight: 700; margin-right: 4px; }

  /* below the fold: ads, editorials, letters, classifieds */
  .fold { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; margin-top: 5px; padding-top: 4px; border-top: 3px double var(--rule); overflow: hidden; }
  .fold > .col { overflow: hidden; min-height: 0; position: relative; }
  .fold > .col:first-child { border-right: 1px solid var(--hair); padding-right: 9px; }
  .item { margin-bottom: 6px; padding-bottom: 5px; border-bottom: 1px solid var(--hair); font-size: 11px; line-height: 1.24; }
  .item .kick { font-size: 8.5px; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); }
  .item h3 { margin: 0 0 2px; font-size: 13.5px; line-height: 1.05; font-weight: 900; }
  .item .by { font-style: italic; color: var(--ink2); text-align: right; font-size: 10px; margin-top: 1px; }
  .item.ad { border: 2px solid var(--ink); outline: 1px solid var(--ink); outline-offset: -5px; padding: 7px 8px; text-align: center; background: rgba(255,250,235,.3); }
  .ad .big { font-family: Playbill, "Engravers MT", Impact, serif; font-size: 25px; line-height: .95; letter-spacing: .5px; }
  .ad .eng { font-family: "Engravers MT", Castellar, Georgia, serif; font-size: 10px; letter-spacing: 1px; line-height: 1.15; }
  .ad .bk { font-family: var(--black); font-size: 20px; line-height: 1; }
  .ad .fine { font-size: 8px; font-style: italic; color: var(--ink2); margin-top: 2px; }
  .ad.inv { background: var(--ink); color: var(--paper); outline-color: var(--paper); }
  .ad.inv .fine { color: #cdbd9b; }
  .item.ad.tiny { padding: 3px 6px; outline: 0; border-width: 1px; font-size: 10.5px; font-style: italic; }
  .item.ad.tiny .eng { font-style: normal; font-size: 8.5px; }
  .item.run { border-left: 3px solid var(--red); padding-left: 6px; }
  .item.run .kick { color: var(--red); }
  .item.board { background: #2e3a2c; color: #f2eee0; padding: 5px 7px; border: 3px solid #6b4a2a; font-family: 'Segoe Print', 'Comic Sans MS', cursive; font-size: 10.5px; }
  .item.board .kick { color: #e8d9a8; text-align: center; }
  .item.board div + div { border-top: 1px dashed rgba(242,238,224,.3); }
  .strip { margin-bottom: 4px; }
  .strip-title { font-family: var(--black); font-size: 15px; line-height: 1; margin: 2px 0 1px; }
  .panels { display: flex; gap: 3px; }
  .panel { flex: 1; border: 1.5px solid var(--ink); background: #fbf5e6; line-height: 0; }
  .item.gag .panel { margin: 2px 0; }
  .gag-cap { font-style: italic; text-align: center; font-size: 10.5px; margin-top: 2px; }
  .cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
  .cols2 > div:first-child { border-right: 1px solid var(--hair); padding-right: 9px; }
  .scope div { padding: 1px 0; font-size: 10.5px; border-bottom: 1px dotted var(--hair); }
  .scope b { font-variant: small-caps; color: var(--accent); }
  .puzzle .jw { letter-spacing: 2px; font-family: 'Courier New', monospace; }
  .ans { margin-top: 3px; font-size: 9.5px; color: var(--ink2); text-align: right; }
  pre.wsearch { font: bold 11px/1.25 'Courier New', monospace; text-align: center; margin: 3px 0; letter-spacing: 1px; }
  .ws-words { font-size: 9.5px; text-align: center; color: var(--accent); }
  .flip { display: inline-block; transform: rotate(180deg); }
  .ingr { font-size: 9.5px; font-style: italic; color: var(--accent); margin-bottom: 2px; }
  .item.obit { border: 1px solid var(--ink); padding: 4px 6px; background: rgba(0,0,0,.04); }
  .stars { color: var(--accent); font-size: 11px; letter-spacing: 1px; }
  .pbar { position: relative; font-size: 10px; padding: 1px 3px; margin: 2px 0; border: 1px solid var(--hair); display: flex; justify-content: space-between; }
  .pbar > div { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(122,75,22,.25); z-index: 0; }
  .pbar span, .pbar b { position: relative; z-index: 1; }
  ol.top { margin: 2px 0 0 16px; padding: 0; font-size: 10.5px; }
  .vox p { font-size: 10.5px; margin-bottom: 2px; }
  .item.prop .price { text-align: right; font-weight: 900; font-size: 12px; }
  .squad { font-size: 11px; border: 1px solid var(--rule); padding: 3px 5px; background: rgba(255,250,235,.35); margin-bottom: 4px; }
  .court div { font-size: 10.5px; padding: 1px 0; border-bottom: 1px dotted var(--hair); }
  .wirelist div { font-size: 11.5px; padding: 2px 0; border-bottom: 1px dotted var(--hair); }
  .item.wire .kick { color: var(--red); }
  .item.wire p { margin-bottom: 2px; }
  .cls div { padding: 1px 0; border-bottom: 1px dotted var(--hair); }
  .cls div:last-child { border: 0; }
  .cls b { font-variant: small-caps; }

  /* on-camera card: the dwarf the spectator camera follows (bottom third) */
  .follow { flex: 0 0 27%; min-height: 0; overflow: hidden; margin-top: 4px; padding-top: 3px; border-top: 3px double var(--rule); font-size: 13px; line-height: 1.25; }
  .follow .kicker { display: flex; justify-content: space-between; }
  .follow .live { color: var(--red); font-weight: bold; letter-spacing: 1px; }
  .follow .live::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--red); margin-right: 4px; vertical-align: 0; animation: blink 1.6s infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .follow h3 { margin: 1px 0 0; font-size: 21px; line-height: 1.05; }
  .follow .sub { font-style: italic; color: var(--ink2); font-size: 12.5px; margin-bottom: 2px; }
  .follow .doing { font-size: 15px; padding: 2px 0; border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair); }
  .follow .doing b { font-variant: small-caps; }
  .follow .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; margin-top: 3px; }
  .follow .grid > div:first-child { border-right: 1px solid var(--hair); padding-right: 8px; }
  .follow .lbl { font-variant: small-caps; font-weight: bold; color: var(--ink2); font-size: 12.5px; letter-spacing: .4px; }
  .follow .row { display: flex; justify-content: space-between; gap: 4px; white-space: nowrap; overflow: hidden; }
  .follow .row span:first-child { overflow: hidden; text-overflow: ellipsis; }
  .follow .bar { height: 7px; background: var(--paper2); border: 1px solid var(--hair); margin: 1px 0 2px; }
  .follow .bar i { display: block; height: 100%; }
  .follow .warn { color: var(--red); font-weight: bold; }
  .follow .th { font-style: italic; font-size: 12px; color: var(--ink2); margin-top: 3px; border-top: 1px dotted var(--hair); padding-top: 2px; }
  .late { margin-top: 3px; border-top: 3px double var(--rule); padding-top: 2px; }
  .late .txt { font-size: 11px; line-height: 1.3; text-align: justify; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .late .txt span + span::before { content: " \2756 "; color: var(--accent); }
  .nav { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 3px 0 0; height: 14px; }
  .nav button { font: 10px Georgia, serif; color: var(--paper); background: var(--ink); border: 0; border-radius: 2px; width: 22px; height: 14px; padding: 0; cursor: pointer; opacity: 0; transition: opacity .25s; }
  .nav button:disabled { opacity: 0 !important; cursor: default; }
  .paper:hover .nav button, .paper.held .nav button { opacity: .85; }
  .nav button:hover { opacity: 1; }
  #nav-status { font: italic 9.5px Georgia, serif; color: var(--red); letter-spacing: .5px; }
  .dots span { cursor: pointer; }
  .dots { text-align: center; line-height: 0; }
  .dots span { display: inline-block; width: 6px; height: 6px; border-radius: 50%; border: 1px solid var(--ink2); margin: 0 3px; }
  .dots span.on { background: var(--ink); }
#follow .portrait { float: right; width: 112px; height: 112px; image-rendering: pixelated; margin: 0 0 4px 8px;
  border: 1px solid #2b2118; background: radial-gradient(circle at 50% 60%, #efe3c4 0%, #d9c79f 100%); }
.beastdesc { font-style: italic; font-size: 13px; line-height: 1.35; margin: 4px 0 6px; padding: 4px 6px; border-left: 3px solid #8b1a1a; }
</style>
</head>
<body>
<div class="paper">
  <div class="mast">
    <div class="ear" id="ear-l">Weather<b>…</b></div>
    <h1><span class="the">The</span><span id="title">Fortress Herald</span></h1>
    <div class="ear" id="ear-r">Price<b>1☼</b>Two if you<br>ask nicely</div>
  </div>
  <div class="motto">"All the News That's Fit to Engrave" · Published Beneath the Mountain</div>
  <div class="issue"><span id="issue-date">…</span><span id="issue-season"></span><span id="issue-pop"></span></div>
  <div id="card"></div>
  <div class="nav"><button id="nav-prev" title="Previous page (←)" onclick="navPrev()">◀</button><div class="dots" id="dots"></div><span id="nav-status"></span><button id="nav-hold" onclick="hold(!browsing)">❚❚</button><button id="nav-next" title="Next page (→)" onclick="navNext()">▶</button></div>
  <div class="fold"><div class="col" id="colA"></div><div class="col" id="colB"></div></div>
  <div class="follow" id="follow"></div>
  <div class="late"><div class="kicker"><span>Late Edition</span><span>Stop the Presses</span></div><div class="txt" id="late"></div></div>
</div>
<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pretty = s => String(s ?? '').replace(/([a-z])([A-Z])/g, '$1 $2').replace(/_/g, ' ').toLowerCase()
                       .replace(/(^|\s)\S/g, c => c.toUpperCase());
const levels = ['Dabbling','Novice','Adequate','Competent','Skilled','Proficient','Talented','Adept','Expert',
                'Professional','Accomplished','Great','Master','High Master','Grand Master','Legendary'];
const clean = s => String(s ?? '').replace(/[^\x20-\x7E\u00C0-\u024F]/g, '');
const cap = s => s.replace(/(^|[\s"])(\S)/g, (m, a, b) => a + b.toUpperCase());   // DF leaves accented initials lowercase (îton)
const firstName = n => cap(clean(String(n).split(',')[0]));
const an = w => (/^[aeiou]/i.test(w) ? 'an ' : 'a ') + w;

// deterministic randomness: same dwarf -> same interview; fillers reshuffle each card
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const pick = (r, a) => a[Math.floor(r() * a.length)];
function shuffle(r, a) { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

let S = {ok: false}, H = {artifacts: []}, W = null, K = null, prevStocks = null, artIdx = 0;

// ---------- masthead + late edition ----------
function forecastOf(wx) {
  return !wx ? 'Unknown' : wx.kind === 'snow' ? (wx.amount > .5 ? 'Heavy snow' : 'Light snow')
       : wx.kind === 'rain' ? (wx.amount > .5 ? 'Heavy rain' : 'Showers') : 'Clear skies';
}
function masthead() {
  if (!S.ok) return;
  const f = S.fort;
  const pp = paper();
  document.getElementById('title').textContent = pp.title; document.title = 'The ' + pp.title;
  document.querySelector('.motto').textContent = `"${pp.motto}" · ${f.name}, ${clean(f.world || '')}`;
  fitTitle();
  document.getElementById('issue-date').textContent = `${f.day} ${f.month}, Yr ${f.year}`;
  document.getElementById('issue-season').textContent = S.weather ? S.weather.season : '';
  document.getElementById('issue-pop').textContent = `Vol. ${f.year} · Pop. ${f.population}`;
  document.getElementById('ear-l').innerHTML = `Weather<b>${esc(forecastOf(S.weather))}</b>${S.weather && S.weather.kind !== 'clear' ? 'Stay below' : 'Go outside?<br>Why'}`;
  document.getElementById('late').innerHTML = (S.events || []).slice(0, 8).map(e => `<span>${esc(clean(e.text))}</span>`).join('');
}

// ---------- the library: pregenerated pieces tailored to current events, never repeating soon ----------
// herald/library/*.json holds hundreds of templates with {slots} and "when" conditions. Every entry printed is
// reported to /seen, and picks always prefer the least-recently printed entry, with topical ones first.
let LIB = {}, SEEN = {}, issueUsed = new Set();
const NEWSY = /\{(mineral|masterwork|masterwright|promoted|post|deadname|moodname)\}/;
// test URLs (?hold, ?card=N, ?breaking=..., ?test) never write seen.json or memory.json: a fake event must not become fort history
const TESTPAGE = /[?&](hold|card|breaking|test)\b/.test(location.search);
function markSeen(ids) {
  ids = [...new Set(ids)].filter(Boolean); if (!ids.length) return;
  if (TESTPAGE) return;
  const now = Date.now() / 1000 | 0; ids.forEach(i => SEEN[i] = now);
  fetch('/seen', {method: 'POST', body: JSON.stringify({ids})}).catch(() => {});
}
function newsSlots() {
  const o = {}, evs = (S.events || []).map(e => clean(e.text)), big = S.big || [];
  for (const t of evs) {
    let m;
    if (!o.mineral && (m = t.match(/struck (.+?)!/))) o.mineral = m[1].replace(/^(some|an?) /, '');
    if (!o.masterwork && (m = t.match(/^(.+?) has created an? masterpiece (.+?)!?$/))) { o.masterwright = cap(m[1]); o.masterwork = m[2].replace(/\[\d+\]/, '').trim(); }
    if (!o.promoted && (m = t.match(/^(.+?) has become an? (.+?)\.$/))) { o.promoted = cap(m[1]); o.post = m[2].toLowerCase(); }
  }
  for (const b of big) {
    const t = clean(b.text), nm = (t.match(/^([^,]+),/) || [])[1];
    if (b.type === 'CITIZEN_DEATH' && nm && !o.deadname) {
      o.deadname = cap(nm);
      const m = t.match(/^[^,]+,\s*(.+?) has (.+?)\.?$/);   // "Bomrek Enshalcatten, Miner has been found dead, dehydrated."
      if (m) { o.prof = m[1].toLowerCase(); o.cause = m[2].replace(/\.+$/, '').trim() || 'died in mysterious circumstances'; }
    }
    if (/MOOD/.test(b.type) && nm && !o.moodname) o.moodname = cap(nm);
    if (/MASTERPIECE/.test(b.type) && !o.masterwork) { const m = t.match(/^(.+?) has created an? masterpiece (.+?)!?$/); if (m) { o.masterwright = cap(m[1]); o.masterwork = m[2].replace(/\[\d+\]/, '').trim(); } }
    if (/STRUCK/.test(b.type) && !o.mineral) { const m = t.match(/struck (.+?)!/); if (m) o.mineral = m[1]; }
    if (/MIGRANT/.test(b.type)) o._migrants = 1;
    if (/CARAVAN/.test(b.type)) o._caravan = 1;
  }
  return o;
}
// ---------- world lore: learned from play by herald_lore.py (past forts, their fates, absurd records) ----------
let LORE = {past: [], records: []};
async function pollLore() { try { const l = await get('/lore.json'); if (l && l.forts) LORE = l; } catch (e) {} }
function loreSlots(r) {
  const past = (LORE.past || []).filter(f => f.name !== (S.fort || {}).name), recs = LORE.records || [];
  const pf = past.length ? pick(r, past) : null, rec = recs.length ? pick(r, recs) : null;
  let pol = {};
  try { pol = PO && PO.ok ? polSlots(r) : {}; } catch (e) {}
  return {past_fort: pf ? cap(clean(pf.name)) : null, past_fort_fate: pf ? pf.fate : null, past_fort_years: pf ? pf.years : null,
    record: rec ? rec.text : null, record_fort: rec ? cap(clean(rec.fort)) : null,
    civ: pol.civ || null, monarch: pol.monarch || null, liaison: pol.liaison || null, enemy: pol.enemy || null, enemy_race: pol.enemy_race || null};
}
// ---------- running storylines (arcs): a big event keeps being covered for days afterwards ----------
// trackStories() records the newest event of each kind in memory (who, when, details); entries follow up on it
// with {lastdead}, {moody}, {artifact_new}... and conditions like death_week or mood_open.
const ARC_OF = [[/CITIZEN_DEATH/, 'death'], [/STRANGE_MOOD/, 'mood'], [/MADE_ARTIFACT|NAMED_ARTIFACT/, 'artifact'], [/MIGRANT/, 'migrants'],
  [/BIRTH_CITIZEN/, 'birth'], [/MASTERPIECE/, 'masterpiece'], [/MARRIAGE/, 'marriage'], [/MEGABEAST|WEREBEAST|BEAST_AMBUSH/, 'beast'], [/CARAVAN/, 'caravan']];
function arcInfo(kind, t) {
  const nm = (t.match(/^([^,]+?)(?:,| has | withdraws| is )/) || [])[1];
  const o = {name: nm && !/^(Some|A|An|The|You)\b/.test(nm) ? cap(nm.trim()) : null};

const MAP_W = 456, MAP_H = 300;

}

function startMap() {
  const cv = document.getElementById('map'); if (!cv || !mapImg) return;
  const g = cv.getContext('2d'), s = mapImg.scale;
  const fx = W.fort ? W.fort.x * s : mapImg.width / 2, fy = W.fort ? W.fort.y * s : mapImg.height / 2;
  let wx = null, wxKey = '';
  const sky = () => {   // follow the live weather while the card is up: rain can start or stop mid-page
    const w = S.weather || {kind: 'clear', amount: 0}, k = w.kind + ':' + Math.round((w.amount || 0) * 5);
    if (k === wxKey) return;

    const fc = document.querySelector('.forecast b'); if (fc) fc.textContent = forecastOf(wx);

    const mx = fx - ox + s / 2, my = fy - oy + s / 2, pulse = 6 + 3 * Math.sin(t * 3);
    g.strokeStyle = '#8f2a1c'; g.lineWidth = 2; g.beginPath(); g.arc(mx, my, pulse, 0, 7); g.stroke();
    g.fillStyle = '#8f2a1c'; g.font = 'bold 13px Georgia'; g.textAlign = 'center'; g.fillText('★ ' + (W.fort ? W.fort.name : ''), mx, my - 12);
    for (const p of particles) {
      if (wx.kind === 'snow') { p.y += p.v * .8; p.x += Math.sin(t + p.v * 9) * .4; g.fillStyle = 'rgba(255,255,255,.9)'; g.beginPath(); g.arc(p.x, p.y, 1.2 + p.v, 0, 7); g.fill(); }
      else { p.y += p.v * 7; p.x -= p.v * 1.5; g.strokeStyle = 'rgba(70,90,120,.55)'; g.lineWidth = 1; g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(p.x + 2, p.y - 8); g.stroke(); }

}

  const par = new Set(Object.values((LIB.itemcats || {}).parents || {}));
  let best = 0;
  for (const t of sc.fit || []) if (t[0] !== '!' && facts.has(t)) best = Math.max(best, t.startsWith('n_') ? 3 : par.has(t) ? 1 : 2);
  return best;

// ---------- rumours: real news the fort heard from diplomats, the liaison and caravans ----------
// DF's rumour system (fort government's rumor_info, the Civilizations/World Info screen), read by dfai-overlay-rumors.lua.
let RU = {rumors: [], visits: []};

  Labyrinth: 'labyrinth', Shrine: 'shrine', Tomb: 'tomb', Vault: 'vault', Fort: 'fort', DarkPits: 'dark pits', Hillocks: 'hillocks'};

function agoOf(h) {

}

    const vd = v.year * 336 + Math.floor(Math.max(0, v.tick || 0) / 1200);
    if (Math.abs(ld - vd) <= 2) return v.who ? `${v.civ && v.civ.race === 'dwarven' ? 'the outpost liaison' : 'the diplomat'} ${cap(clean(v.who))}` : 'the outpost liaison';
  }

    entity2: n(x.entity2), entity2_race: x.entity2 && x.entity2.race || null, hf: n(x.hf), hf_race: x.hf && x.hf.race || null,
    hf2: n(x.hf2), hf2_race: x.hf2 && x.hf2.race || null, region: n(x.region), artifact: n(x.artifact),
    artifact_item: x.artifact && x.artifact.item ? clean(x.artifact.item).replace(/[*«»≡☼+-]/g, '').trim() : null,
    ago: agoOf(x.happened), source: rumorSource(x)};

// least-recently printed first, with freshly heard news jumping the queue
function chooseRumors(n, r) {

    const id = rumorKey(x), fresh = Math.max(0, 40 - (today - learnedDay(x)));
    return {x, id, score: (SEEN[id] || 0) - fresh * 7200 + r() * 1800};
  }).filter(o => !issueUsed.has(o.id)).sort((a, b) => a.score - b.score);
  const out = [], seenText = new Set();
  const types = new Set();   // one story per kind per page: 57 refugee reports shouldn't crowd out the one succession
  for (const o of c) { if (out.length >= n) break; if (types.has(o.x.type) && c.some(z => !types.has(z.x.type) && !out.includes(z))) continue; types.add(o.x.type); out.push(o); issueUsed.add(o.id); }
  return out;
}
function rumorPiece(x, field, r) {
  const list = field === 'briefs' ? (LIB.briefs || {})[x.type] : ((LIB.rumors || {})[x.type] || {})[field];
  const e = choose1(list, context(r), r, rumorSlots(x));

}
const learnedOn = x => { const d = learnedDay(x); return dateOf(d); };
function wireItem(r) {
  const [o] = chooseRumors(1, r); if (!o) return null;
  const b = rumorPiece(o.x, 'briefs', r); if (!b) return null;
  return {ids: [o.id, b.id], html: `<div class="item wire"><div class="kick">On the Wire · ${esc(o.x.type.replace(/_/g, ' '))}</div><p class="just">${esc(b.text)}</p><div class="by">— via ${esc(rumorSlots(o.x).source)}</div></div>`};

// new rumours since the last look: the Diplomatic Pouch interrupts like breaking news

  return out;
}

function fillers(r) {
  // the trade desk leads every other issue (stories would otherwise always fill the fold)
  const ctx = context(r), trade = [...tradeItems(ctx, r), ...worksItems(ctx, r)], lead = r() < 0.6;
  const out = [...(lead ? shuffle(r, trade).slice(0, 2) : []), ...storyItems(ctx, r), ...(lead ? [] : trade), ...officialItems(ctx, r), ...pageItems(ctx, r), ...featureItems(ctx, r)];
  const put = (ids, html) => out.push({ids: [].concat(ids), html});
  // display ads
  for (const a of choose(LIB.ads, ctx, r, 7))
    put(a.id, `<div class="item ad${a.inv ? ' inv' : ''}">${(a.lines || []).map(([st, tx]) => `<div class="${esc(st)}">${esc(tx)}</div>`).join('')}</div>`);
  // editorials / columns
  for (const e of choose(LIB.editorials, ctx, r, 3))

  // classifieds block

  // almanac + proverb, trivia
  const al = choose1(LIB.almanac, ctx, r), pv = choose1(LIB.proverbs, ctx, r);
  if (al || pv) put([al && al.id, pv && pv.id], `<div class="item"><div class="kick">Almanac</div><p class="just">${al ? esc(T(al)) + ' ' : ''}${pv ? `Proverb of the day: <i>"${esc(T(pv))}"</i>` : ''}</p></div>`);
  const tv = choose1(LIB.trivia, ctx, r);
  if (tv) put(tv.id, `<div class="item"><div class="kick">On This Day</div><p class="just">${esc(T(tv))}</p></div>`);
  // our sketch artist: recent big events and a portrait of today's interviewee
  for (const ev of (S.big || []).filter(e => e.id !== breakingOn && !(cardIdx === 1 && e.id === funniesEv)).slice(0, 2)) {
    const res = drawEvent(ev, 240, 140); if (!res) continue;
    put([], `<div class="item"><div class="kick">From Our Sketch Artist</div><h3>${esc(res.t.head)}</h3>${res.svg}<p class="just" style="font-style:italic;font-size:10px;margin-top:2px">${esc(clean(ev.text))} ${esc(res.t.cap)}</p></div>`);
  }
  if (S.dwarf) put([], `<div class="item"><div class="kick">Courtroom Sketch</div>${portrait(S.dwarf)}<p style="font-style:italic;font-size:10px;text-align:center">${esc(firstName(S.dwarf.name))}, as seen by our artist. Likeness not guaranteed.</p></div>`);
  // small notices go last: they plug the leftover gaps at the bottom of the columns
  const tiny = choose(LIB.notices, ctx, r, 8).map(nt => ({ids: [nt.id], html: `<div class="item ad tiny"><div class="eng">Notice</div>${esc(T(nt))}</div>`}));
  // a storyline follow-up leads the fold; everything else is shuffled
  return [...out.filter(x => x.lead), ...shuffle(r, out.filter(x => !x.lead)), ...tiny];
}
function fillFold() {
  // pack items into the two columns, shortest column first; anything that would be cut off is skipped
  const A = document.getElementById('colA'), B = document.getElementById('colB');
  A.innerHTML = ''; B.innerHTML = '';
  const limit = A.clientHeight; if (limit < 30) return;
  const r = rng(Date.now() / 1000 | 0), placed = [];
  const used = col => col.lastElementChild ? col.lastElementChild.offsetTop + col.lastElementChild.offsetHeight : 0;
  for (const it of fillers(r)) {
    const first = used(A) <= used(B) ? A : B;
    for (const target of [first, first === A ? B : A]) {
      const t = document.createElement('template'); t.innerHTML = it.html.trim();
      const el = t.content.firstElementChild; target.appendChild(el);
      if (el.offsetTop + el.offsetHeight <= limit) { placed.push(...it.ids); break; }
      el.remove();
    }
  }
  markSeen(placed);   // only what actually made it into print counts as used
}

// ---------- rotation ----------
const CARDS = [
  {fn: cardDwarf, secs: 30}, {fn: cardFunnies, secs: 35}, {fn: cardMap, secs: 30, after: startMap}, {fn: cardAg, secs: 20}, {fn: cardPastimes, secs: 30}, {fn: cardForeign, secs: 30}, {fn: cardPolitics, secs: 30}, {fn: cardArchive, secs: 20},
];
const params = new URLSearchParams(location.search);   // ?card=N&hold to pin one card (testing)
// ?zoom=1.5 scales the whole paper (OBS browser sources: set the source width to 480*zoom)
if (params.has('zoom')) { const z = Math.max(0.5, Math.min(3, Number(params.get('zoom')) || 1)); document.body.style.zoom = z;
  addEventListener('DOMContentLoaded', () => { const pp = document.querySelector('.paper'); pp.style.height = `calc(${100 / z}vh - 12px)`; pp.style.minHeight = '0'; }); }
let cardIdx = params.has('card') ? Number(params.get('card')) - 2 : -1, cardTimer = null;
function showCard(html, after) {
  const el = document.getElementById('card');
  el.innerHTML = html; el.classList.remove('fadein'); void el.offsetWidth; el.classList.add('fadein');
  if (after) after(); else cancelAnimationFrame(mapAnim);
  fillFold();
}
function newIssue() {
  issueUsed = new Set();
  const r = rng(Date.now() / 1000 | 0), ear = choose1(LIB.ears, context(r), r);
  if (ear) { document.getElementById('ear-r').innerHTML = `Price<b>1☼</b>${esc(T(ear))}`; markSeen([ear.id]); }
}
function nextCard() {
  newIssue();
  // big news jumps the queue: one Breaking card per new event, then the normal rotation resumes
  while (breakingQ.length) {
    const ev = breakingQ.shift(), html = cardBreaking(ev);
    if (!html) continue;
    breakingOn = ev.id; showCard(html);
    document.getElementById('dots').innerHTML = '<span class="on" style="background:var(--red);border-color:var(--red)"></span>';
    recordIssue(false);
    clearTimeout(cardTimer); cardTimer = setTimeout(() => { breakingOn = false; if (!browsing) nextCard(); }, 25000);
    return;
  }
  for (let tries = 0; tries < CARDS.length; tries++) {
    cardIdx = (cardIdx + 1) % CARDS.length;
    const c = CARDS[cardIdx], html = c.fn();
    if (!html) continue;
    showCard(html, c.after);
    document.getElementById('dots').innerHTML = CARDS.map((_, i) => `<span class="${i === cardIdx ? 'on' : ''}" onclick="cardIdx = ${i - 1}; nextCard(); hold(true)"></span>`).join('');
    recordIssue(c.after === startMap);
    clearTimeout(cardTimer);
    if (!params.has('hold') && !browsing) cardTimer = setTimeout(nextCard, c.secs * 1000);
    return;
  }
  clearTimeout(cardTimer); cardTimer = setTimeout(nextCard, 3000);
}

const ROOMBLURBS = {"Tavern": ["The fort's living room, with worse furniture and better drink. Stories told here grow a foot every time they're retold.", "Ale is poured, songs are sung, and at least one dwarf is explaining at length why the last fight wasn't his fault.", "Performers, regulars and the odd visiting poet. The keeper has heard every story twice and pretends otherwise."], "Temple": ["Candles, carvings and a hush broken only by a dwarf praying a little too loudly for a pay rise.", "Dwarves come to pray, meditate, and stare at the ceiling until something feels better.", "Built for the gods, used mostly by dwarves who need ten minutes away from everyone else."], "Library": ["Shelves of scrolls, quires and codices. Scholars come here to argue in writing.", "A quiet room where scholars copy books, debate philosophy, and shush the miners.", "Every book in here was written by somebody convinced they were right."], "Guildhall": ["The members meet here to compare techniques, trade gossip and complain about the overseer.", "Part workshop, part club, part complaints department.", "Where the trade's old hands lecture the apprentices on how things were done in the Mountainhomes."], "Hospital": ["Beds, splints, crutches and a doctor who swears the saw is clean.", "The fort's wounded come here to heal, or at least to lie down where someone can see them.", "Every scar in the fort has a story, and most of them start in this room."], "Dining Hall": ["Long tables, stone chairs and the clatter of a whole fort eating at once. A good meal here keeps the peace.", "The heart of fort life: dwarves gather to eat, gossip and judge each other's table manners.", "Meals are served at all hours. The roasts are dwarf-sized; the arguments are bigger."], "Meeting Hall": ["Idle dwarves gather here to chat, swap rumours and wait to be given something to do.", "Where the fort's news travels faster than its couriers.", "A crowd with nowhere to be. Half the fort's friendships, and most of its feuds, start here."], "Barracks": ["The soldiers drill, spar and sleep here. Weapon racks line the walls and the floor remembers every fall.", "The fort's defenders train here day in, day out, waiting for the next thing to come out of the caverns.", "Sweat, steel and shouting. Every forgotten beast that came calling met these dwarves."], "Pasture": ["The fort's herds graze here, safe from the weather and from anyone who looks hungry.", "Livestock wander, chew and breed. The butcher visits on a schedule nobody tells them about.", "Food, wool, milk and the occasional escape attempt."], "Trade Depot": ["Caravans unload here, and the broker haggles over the value of a stone mug like it's an artifact.", "Goods arrive from the far corners of the world. Fort trinkets leave, often at a surprising markup.", "The fort's front desk. Every merchant, diplomat and elf with an opinion comes through here first."], "Mist Generator": ["Windmills on the roof drive the pumps, the pumps throw water into the air, and the mist falls here. Dwarves walk through it and come out happier.", "Engineering in the service of contentment: a fine drizzle that lifts the mood of anyone passing through.", "Few forts can say they built their own weather. This one did, and the dwarves love it."], "Entrance": ["The way in. Also, regrettably, the way in for everything else.", "Every migrant, merchant and monster starts its visit right here.", "The fort's front door. The guards here have seen everything walk through it, and have opinions about most of it."], "Hall": ["A gathering place with a purpose only the dwarves fully understand.", "One of the fort's public halls, busy at all hours with dwarves who should probably be working."], "Workshop": ["Where the fort makes things, some of them on purpose.", "Sawdust, stone chips and a craftsdwarf who insists the last one was a prototype."], "Furnace": ["Hot work. Mind the beard.", "Fire, fuel and a dwarf who hasn't felt cold in years."], "The Windmills": ["Up top, the sails turn in the wind and drive the axles that power the mist generator below.", "Free power from the sky. The dwarves are suspicious of anything free, but they keep the windmills anyway."], "The Execution Tower": ["Convicted criminals are dropped from the top. Justice in this fort is swift and mostly downhill.", "The fort's most direct form of law. Residents tend to behave after the first visit."], "The Execution Pit": ["A hatch in the floor, a shaft cut eleven levels into the rock, and no way back up. Caged invaders take the short way down.", "Justice, dwarf-style: quiet, final, and entirely underground. Nobody has ever climbed out, and nobody goes down to check.", "The guards keep the cages lined up by the hatch. The prisoners can hear how deep it is."], "The Refuse Chute": ["Bones, shells and ruined socks go down the hole and stay down. Out of sight, out of mind, out of reach.", "The fort's garbage falls into a sealed pit that no dwarf will ever have to walk into again.", "Toss it in, listen for the thud, get back to work."], "The Cistern": ["The fort's water reserve, deep and cold. If the river freezes or the caverns go dry, this keeps everyone drinking.", "Still water in the dark, waiting for the day the fort needs it."], "The Catacombs": ["Row on row of tombs. The fort buries its dead here so that they stay where they're put.", "Every name carved here was once a dwarf with a favourite mug and an opinion about cheese.", "Quiet and well tended. The fort learned the hard way what happens when the dead are left lying around."], "The Jail": ["Cells for the lawless. The captain of the guard keeps the keys, and the inmates keep their complaints.", "Rule-breakers wait out their sentences here, nursing grudges and the occasional bruise."], "The Garbage Dump": ["Where the fort's refuse ends up. Not the stop on the tour anyone asked for, but it's honest.", "Bones, shells, scraps and ruined socks. A history of the fort, if you read it in the right order."], "The Underground Farms": ["Muddy fields under the mountain, growing plump helmets, cave wheat and the fort's future drinks.", "Most of what the fort eats and nearly all of what it drinks starts life in these plots."], "The Still": ["Plants go in, booze comes out. The most important workshop in the fort, and the dwarves will tell you so.", "Without this room the fort would have a very different, and much shorter, history."], "The Kitchen": ["Roasts, biscuits and stews come out of here, along with the cook's strong opinions about seasoning.", "Lavish meals keep dwarves happy, and this is where the happiness gets cooked."], "The Forge": ["Hammers ring, sparks fly, and raw metal becomes weapons, armour and the occasional masterwork bucket.", "The fort's soldiers are only as good as what comes off this anvil."], "The Craftsdwarf's Workshop": ["Mugs, figurines, rings and trinkets: the things caravans pay too much for.", "Bone, stone and wood become crafts here. Much of the fort's trade wealth started on this bench."], "The Mason's Workshop": ["Raw stone goes in, tables, doors, coffins and statues come out. The fort is furnished one block at a time.", "Chip by chip, the mountain becomes furniture."], "The Carpenter's Workshop": ["Logs become beds, barrels, bins and buckets. Every elf in the world disapproves of this room.", "The smell of sawdust and the sound of a dwarf swearing at a splinter."], "The Jeweler's Workshop": ["Rough gems are cut and set here, turning dull stones into the fort's finest sparkle.", "Precision work in a fort of hammers. The jewelers treat every gem like a long-lost relative."], "The Butcher's Shop": ["Livestock come in, and meat, fat, bones and leather go out. Best not to linger.", "Grim work, but it keeps the dining hall in roasts."], "The Fishery": ["The day's catch is cleaned and prepared here. The smell gets everywhere, and so does the fish.", "River fish become dinner. Whatever came up in the net is the fort's problem now."], "The Loom": ["Thread becomes cloth, and cloth becomes clothes, bandages and the occasional artifact sock.", "Steady, patient work. The weavers keep the fort dressed, and its doctors stocked."], "The Farmer's Workshop": ["Plants are processed, threshed and spun here. Not glamorous, but the fort would starve without it.", "Where harvests become thread, flour, dyes and paper."], "The Bowyer's Workshop": ["Crossbows and bolts are made here for the fort's marksdwarves.", "Wood and bone are carved into something that can stop a goblin at fifty paces."], "The Siege Workshop": ["Ballistae, catapults and the bolts to go with them. Overkill, by dwarven standards, is a starting point.", "Engineers dream big here, usually in the direction of the enemy."], "The Mechanic's Workshop": ["Gears, levers and mechanisms: everything that makes the fort's traps, doors and pumps work.", "Small parts, big consequences. Most of the fort's clever tricks start on this bench."], "The Smelter": ["Ore goes in red-hot and comes out as bars of metal. The forge depends on this furnace.", "Rock becomes metal, metal becomes everything else."], "The Magma Smelter": ["Powered by the heat of the earth itself. No fuel needed, just nerve.", "The mountain's own fire smelts the ore here. The dwarves call it efficient; visitors call it terrifying."], "The Glass Furnace": ["Sand becomes glass: windows, vials and the occasional crystal goblet.", "Molten glass and very careful dwarves."], "The Wood Furnace": ["Logs are burned down to charcoal and ash for the forges and soap makers.", "The fort's fuel supply starts here, one smoky log at a time."], "The Kiln": ["Clay becomes pottery, and ash becomes something useful. The heat here never really leaves.", "Pots, jugs and the fort's supply of glaze."]};
let blurbFor = '', blurbText = '';
function roomBlurb(t) {   // one line per visit, a different one on the next visit
  const key = t.name + '|' + t.kind;
  if (key !== blurbFor) {
    const RB = LIB.room_blurbs || {}, pool = [...(ROOMBLURBS[t.name] || ROOMBLURBS[t.kind] || []), ...(RB[t.name] || (ROOMBLURBS[t.name] ? [] : RB[t.kind]) || [])];
    blurbFor = key; blurbText = pool.length ? pool[Math.floor(Math.random() * pool.length)] : '';
  }
  return blurbText;
}
function roomLive(L) {
  if (!L) return '';
  const bits = [];
  if (L.job) bits.push(L.worker ? `${esc(clean(L.worker))} is at work: ${esc(clean(L.job))}` : `On the bench: ${esc(clean(L.job))}`);
  if (L.queued > 1) bits.push(`${L.queued - 1} more order${L.queued > 2 ? 's' : ''} waiting`);
  const who = (L.present || []).filter(p => !L.worker || p.name !== L.worker)
    .map(p => esc(clean(p.name)) + (p.doing ? ` (${esc(clean(p.doing)).toLowerCase()})` : '')).slice(0, 2);
  const rest = L.people - who.length - (L.worker ? 1 : 0);
  if (who.length) bits.push(who.join(' and ') + (rest > 0 ? `, plus ${rest} more,` : '') + (who.length + Math.max(rest, 0) > 1 ? ' are here' : ' is here'));
  else if (rest > 0) bits.push(`${rest} more ${rest > 1 ? 'are' : 'is'} here`);
  if (L.animals) bits.push(`${L.animals} animal${L.animals > 1 ? 's' : ''} about`);
  const txt = bits.length ? bits.join('. ') + '.' : 'Nobody about. Even dwarves need a break.';
  return `<div class="doing"><b>Right now:</b> ${txt}</div>`;
}
let followHtml = '';
function renderFollow() {
  const el = document.getElementById('follow'); if (!el) return;
  const d = S.followed || S.dwarf, live = !!S.followed;
  let html = '';

  if (S.tour && S.tour.statue) {
    const st = S.tour.statue;
    const made = [st.quality ? `${esc(st.quality)} work` : '', st.maker ? `carved by ${esc(st.maker)}` : ''].filter(Boolean).join(', ');

      <div class="sub">${esc(st.item)}${made ? ` &middot; ${made}` : ''}</div>
      ${st.story ? `<div class="beastdesc">${esc(st.story)}</div>` : ''}
      ${st.scene ? `<div class="doing">${esc(st.scene)}</div>` : ''}`;
    if (html !== followHtml) { followHtml = html; el.innerHTML = html; }

  }
  if (S.tour && S.tour.name) {
    html = `<div class="kicker"><span><span class="live">On Camera</span></span><span>Room Tour</span></div>
      <h3>${esc(clean(S.tour.name))}</h3><div class="sub">${esc(S.tour.kind)}</div>
      ${S.tour.detail ? `<div class="doing">${esc(clean(S.tour.detail))}</div>` : ''}<div class="doing">${esc(roomBlurb(S.tour))}</div>${roomLive(S.tour.live)}`;
    if (html !== followHtml) { followHtml = html; document.getElementById('follow').innerHTML = html; }
    return;
  }
  if (d && d.name) {
    const nm = String(d.name).split(',')[0], nick = (nm.match(/"([^"]+)"/) || [])[1];
    const given = cap(clean(nm.replace(/\s*"[^"]*"\s*/, ' ').trim()));
    const m = mood(d.stress || 0);
    const flags = [d.wounds ? `wounded (${d.wounds})` : '', d.unconscious ? 'unconscious' : '', d.hungry ? 'hungry' : '',
                   d.thirsty ? 'thirsty' : '', d.tired ? 'exhausted' : ''].filter(Boolean);
    const skills = (d.skills || []).slice(0, 4).map(s => `<div class="row"><span>${esc(s.name)}</span><span>${esc(levels[Math.min(15, s.level)] || '')}</span></div>`).join('') || '<div><i>No skills to speak of</i></div>';
    const needs = (d.needs || []).slice(0, 4).map(n => `<div class="row"><span>${esc(NEEDWORD[n] || pretty(n))}</span></div>`).join('') || '<div><i>Wants for nothing</i></div>';
    const fam = d.family || [], kinOf = r => fam.filter(f => f.relation === r);
    const sp = kinOf('SPOUSE')[0], kids = kinOf('CHILD'), lov = kinOf('LOVER')[0];
    const kin = [sp ? `${sp.alive ? 'married to' : 'widowed of'} ${esc(firstName(sp.name))}` : lov ? `sweet on ${esc(firstName(lov.name))}` : '',
                 kids.length ? `${kids.length} child${kids.length > 1 ? 'ren' : ''}` : '',
                 kinOf('DEITY').length ? `worships ${esc(firstName(kinOf('DEITY')[0].name))}` : ''].filter(Boolean).join(', ');
    const th = [...new Set((d.thoughts || []).map(t => `${esc(EMOTEWORD(t.emotion))}: ${esc(pretty(t.about).toLowerCase())}`))].slice(0, 3).join(' · ');
    html = `<div class="kicker"><span>${live ? '<span class="live">On Camera</span>' : 'Citizen Profile'}</span><span>${d.citizen === false ? esc(d.race || 'Visitor') : 'Citizen'}</span></div>
      ${d.id != null ? `<img class="portrait" alt="" src="/portrait.png?u=${d.id}&t=${Math.floor(Date.now() / 60000)}" onerror="this.style.display='none'">` : ''}
      <h3>${esc(given)}${nick ? ` <span style="font-weight:normal;font-style:italic;font-size:13px">"${esc(nick)}"</span>` : ''}</h3>
      <div class="sub">${esc(clean(d.profession || ''))}${d.age ? `, ${d.age} years old` : ''}${d.squad ? ` · ${esc(clean(d.squad))}` : ''}${d.strange_mood ? ` · <span class="warn">${esc(pretty(d.strange_mood))} mood!</span>` : ''}</div>
      <div class="doing"><b>Now:</b> ${esc(clean(d.job || 'Idle'))}</div>
      ${d.description && d.citizen === false ? `<div class="beastdesc">${esc(d.description)}</div>
      <div class="lbl">Health</div><div class="${flags.length ? 'warn' : ''}">${flags.length ? esc(flags.join(', ')) : 'Unhurt'}</div>` : `<div class="grid">
        <div><div class="lbl">Mood: ${esc(m.label)}</div><div class="bar"><i style="width:${m.pct}%;background:${m.color}"></i></div>
             <div class="lbl">Health</div><div class="${flags.length ? 'warn' : ''}">${flags.length ? esc(flags.join(', ')) : 'Healthy'}</div>
             <div class="lbl" style="margin-top:2px">Best at</div>${skills}</div>
        <div><div class="lbl">Longs for</div>${needs}${kin ? `<div class="lbl" style="margin-top:2px">Kin</div><div>${kin}</div>` : ''}</div>
      </div>`}
      ${th ? `<div class="th"><b>Lately:</b> ${th}</div>` : ''}`;
  }
  if (html !== followHtml) { followHtml = html; el.innerHTML = html; }
}

const get = async u => (await fetch(u, {cache: 'no-store'})).json();
async function pollState() {
  try { S = await get('/state.json'); } catch (e) { return; }

  if (params.has('breaking') && seenBig) (S.big = S.big || []).unshift({id: 999999, type: params.get('breaking'), text: params.get('text') || 'Urist McTest has done something newsworthy.', year: 105});
  masthead(); checkBig(); trackStories(); renderFollow();
}
async function pollStocks() {

}
async function loadLib() {
  if (!memLoaded) try { MEMALL = await get('/memory.json'); memLoaded = true; } catch (e) {}
  try { const l = await get('/library.json'); if (l && Object.keys(l).length) LIB = l; } catch (e) {}

}
async function pollSlow() {

    const w = await get('/world.json'), key = x => x && [x.world, x.fort && x.fort.name, x.fort && x.fort.x, x.fort && x.fort.y].join('|');

(async () => {
  await Promise.all([pollState(), pollStocks(), pollSlow(), loadLib(), pollRumors(), pollPolitics(), pollLore(), pollTrade(), pollWorks()]);

// reload by itself when overlay.html changes on disk, so OBS never needs a manual refresh
(() => { let base = null;
  const sig = async () => { const t = await (await fetch('/index.html', {cache: 'no-store'})).text(); let h = 0; for (let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) | 0; return t.length + ':' + h; };
