<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>The Fortress Herald</title>
<style>
  :root {
    --paper: #efe4cc; --paper2: #e3d4b2; --ink: #241c13; --ink2: #5a4a36; --rule: #3b2f22; --hair: #a8946c;
    --red: #8f2a1c; --green: #3f6b2e; --accent: #7a4b16;
    --black: "Old English Text MT", "UnifrakturMaguntia", Georgia, serif;
    --body: Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; width: 480px; overflow: hidden; background: transparent; font-family: var(--body); color: var(--ink); }
  .paper {
    margin: 6px; height: calc(100vh - 12px); min-height: 860px; padding: 8px 11px 8px;
    display: flex; flex-direction: column; overflow: hidden;
    background: radial-gradient(ellipse at 30% 20%, #f5ecd8 0%, var(--paper) 55%, var(--paper2) 100%);
    border: 1px solid #b9a57f; box-shadow: 0 6px 22px rgba(0,0,0,.55), inset 0 0 40px rgba(120,90,40,.18);
  }
  p { margin: 0; }
  .just { text-align: justify; hyphens: auto; -webkit-hyphens: auto; }

  /* masthead with ears */
  .mast { display: grid; grid-template-columns: 74px 1fr 74px; align-items: center; gap: 6px; }
  .ear { border: 1px solid var(--rule); padding: 2px 3px; font-size: 8.5px; line-height: 1.2; text-align: center; text-transform: uppercase; letter-spacing: .4px; color: var(--ink2); }
  .ear b { display: block; font-size: 11px; color: var(--ink); letter-spacing: 0; }
  .mast h1 { margin: 0; text-align: center; font-family: var(--black); font-weight: normal; font-size: 37px; line-height: .95; white-space: nowrap; }
  .mast .the { display: block; font-size: 15px; }
  .motto { text-align: center; font-size: 9px; font-style: italic; color: var(--ink2); margin-top: 1px; }
  .issue { display: flex; justify-content: space-between; font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
           border-top: 3px double var(--rule); border-bottom: 1px solid var(--rule); padding: 2px 0; margin: 3px 0 5px; color: var(--ink2); }

  .kicker { font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--accent); border-bottom: 1px solid var(--rule); padding-bottom: 1px; margin-bottom: 3px; display: flex; justify-content: space-between; }
  .headline { font-size: 21px; font-weight: 900; line-height: 1.02; margin: 2px 0 3px; letter-spacing: -.2px; }
  .deck { font-style: italic; font-size: 12.5px; line-height: 1.25; color: var(--ink2); margin-bottom: 4px; }
  .body { font-size: 12.5px; line-height: 1.28; }
  .sub { font-size: 9.5px; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); margin: 4px 0 1px; }
  .line { font-size: 11.5px; line-height: 1.25; display: flex; justify-content: space-between; gap: 4px; }
  .line .lead { flex: 1; border-bottom: 1px dotted var(--hair); margin-bottom: 3px; }
  .dim { color: var(--ink2); }
  .dead { color: var(--red); }
  .fadein { animation: fadein .9s ease; } @keyframes fadein { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
  .bar { height: 5px; background: #d3c29c; border: 1px solid var(--hair); margin: 1px 0 3px; }
  .bar > div { height: 100%; }

  /* interview */
  .iv { font-size: 12.5px; line-height: 1.28; }
  .iv p { margin-bottom: 3px; }
  .iv .q { font-weight: 700; }
  .iv .who { font-variant: small-caps; font-weight: 700; letter-spacing: .3px; }
  .iv .q .who { color: var(--accent); }
  .vitals { float: right; width: 150px; margin: 2px 0 4px 9px; border: 1px solid var(--rule); padding: 3px 5px 2px; background: rgba(255,250,235,.35); }
  .vitals .sub { margin-top: 0; text-align: center; border-bottom: 1px solid var(--rule); }
  .pull { clear: both; margin: 4px 0 5px; padding: 3px 0; border-top: 2px solid var(--rule); border-bottom: 1px solid var(--rule);
          font-size: 15.5px; font-style: italic; font-weight: 700; line-height: 1.15; text-align: center; }
  .dropcap::first-letter { float: left; font-size: 34px; line-height: .8; padding: 3px 3px 0 0; font-weight: 900; }

  /* map / tables / archive */
  .mapwrap { position: relative; border: 1px solid var(--rule); box-shadow: inset 0 0 18px rgba(60,40,10,.35); }
  canvas { display: block; }
  .forecast { display: flex; justify-content: space-between; align-items: baseline; margin-top: 3px; font-size: 12px; }
  .forecast b { font-size: 15px; }
  table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  td { padding: 0; border-bottom: 1px dotted #b9a57f; line-height: 1.35; }
  td.n { text-align: right; width: 50px; font-variant-numeric: tabular-nums; }
  td.t { width: 16px; text-align: center; }
  td.b { width: 110px; padding-left: 6px; }
  .lvl { height: 5px; background: #d3c29c; }
  .lvl > div { height: 100%; background: var(--ink2); }
  .up { color: var(--green); } .down { color: var(--red); }
  .story div { font-size: 12px; line-height: 1.25; padding: 1px 0 1px 7px; border-left: 2px solid var(--hair); margin-bottom: 2px; }
  .yr { font-weight: 700; margin-right: 4px; }

  /* below the fold: ads, editorials, letters, classifieds */
  .fold { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; margin-top: 5px; padding-top: 4px; border-top: 3px double var(--rule); overflow: hidden; }
  .fold > .col { overflow: hidden; min-height: 0; position: relative; }
  .fold > .col:first-child { border-right: 1px solid var(--hair); padding-right: 9px; }
  .item { margin-bottom: 6px; padding-bottom: 5px; border-bottom: 1px solid var(--hair); font-size: 11px; line-height: 1.24; }
  .item .kick { font-size: 8.5px; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); }
  .item h3 { margin: 0 0 2px; font-size: 13.5px; line-height: 1.05; font-weight: 900; }
  .item .by { font-style: italic; color: var(--ink2); text-align: right; font-size: 10px; margin-top: 1px; }
  .item.ad { border: 2px solid var(--ink); outline: 1px solid var(--ink); outline-offset: -5px; padding: 7px 8px; text-align: center; background: rgba(255,250,235,.3); }
  .ad .big { font-family: Playbill, "Engravers MT", Impact, serif; font-size: 25px; line-height: .95; letter-spacing: .5px; }
  .ad .eng { font-family: "Engravers MT", Castellar, Georgia, serif; font-size: 10px; letter-spacing: 1px; line-height: 1.15; }
  .ad .bk { font-family: var(--black); font-size: 20px; line-height: 1; }
  .ad .fine { font-size: 8px; font-style: italic; color: var(--ink2); margin-top: 2px; }
  .ad.inv { background: var(--ink); color: var(--paper); outline-color: var(--paper); }
  .ad.inv .fine { color: #cdbd9b; }
  .item.ad.tiny { padding: 3px 6px; outline: 0; border-width: 1px; font-size: 10.5px; font-style: italic; }
  .item.ad.tiny .eng { font-style: normal; font-size: 8.5px; }
  .cls div { padding: 1px 0; border-bottom: 1px dotted var(--hair); }
  .cls div:last-child { border: 0; }
  .cls b { font-variant: small-caps; }

  .late { margin-top: 3px; border-top: 3px double var(--rule); padding-top: 2px; }
  .late .txt { font-size: 11px; line-height: 1.3; text-align: justify; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .late .txt span + span::before { content: " \2756 "; color: var(--accent); }
  .dots { text-align: center; margin: 3px 0 0; line-height: 0; }
  .dots span { display: inline-block; width: 6px; height: 6px; border-radius: 50%; border: 1px solid var(--ink2); margin: 0 3px; }
  .dots span.on { background: var(--ink); }
</style>
</head>
<body>
<div class="paper">
  <div class="mast">
    <div class="ear" id="ear-l">Weather<b>…</b></div>
    <h1><span class="the">The</span><span id="title">Fortress Herald</span></h1>
    <div class="ear" id="ear-r">Price<b>1☼</b>Two if you<br>ask nicely</div>
  </div>
  <div class="motto">"All the News That's Fit to Engrave" · Published Beneath the Mountain</div>
  <div class="issue"><span id="issue-date">…</span><span id="issue-season"></span><span id="issue-pop"></span></div>
  <div id="card"></div>
  <div class="dots" id="dots"></div>
  <div class="fold"><div class="col" id="colA"></div><div class="col" id="colB"></div></div>
  <div class="late"><div class="kicker"><span>Late Edition</span><span>Stop the Presses</span></div><div class="txt" id="late"></div></div>
</div>
<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pretty = s => String(s ?? '').replace(/([a-z])([A-Z])/g, '$1 $2').replace(/_/g, ' ').toLowerCase()
                       .replace(/(^|\s)\S/g, c => c.toUpperCase());
const levels = ['Dabbling','Novice','Adequate','Competent','Skilled','Proficient','Talented','Adept','Expert',
                'Professional','Accomplished','Great','Master','High Master','Grand Master','Legendary'];
const clean = s => String(s ?? '').replace(/[^\x20-\x7E\u00C0-\u024F]/g, '');
const cap = s => s.replace(/(^|[\s"])(\S)/g, (m, a, b) => a + b.toUpperCase());   // DF leaves accented initials lowercase (îton)
const firstName = n => cap(clean(String(n).split(',')[0]));
const an = w => (/^[aeiou]/i.test(w) ? 'an ' : 'a ') + w;

// deterministic randomness: same dwarf -> same interview; fillers reshuffle each card
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const pick = (r, a) => a[Math.floor(r() * a.length)];
function shuffle(r, a) { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

let S = {ok: false}, H = {artifacts: []}, W = null, K = null, prevStocks = null, artIdx = 0;

// ---------- masthead + late edition ----------
function forecastOf(wx) {
  return !wx ? 'Unknown' : wx.kind === 'snow' ? (wx.amount > .5 ? 'Heavy snow' : 'Light snow')
       : wx.kind === 'rain' ? (wx.amount > .5 ? 'Heavy rain' : 'Showers') : 'Clear skies';
}
function masthead() {
  if (!S.ok) return;
  const f = S.fort;
  document.getElementById('title').textContent = f.name + ' Herald';
  document.getElementById('issue-date').textContent = `${f.day} ${f.month}, Yr ${f.year}`;
  document.getElementById('issue-season').textContent = S.weather ? S.weather.season : '';
  document.getElementById('issue-pop').textContent = `Vol. ${f.year} · Pop. ${f.population}`;
  document.getElementById('ear-l').innerHTML = `Weather<b>${esc(forecastOf(S.weather))}</b>${S.weather && S.weather.kind !== 'clear' ? 'Stay below' : 'Go outside?<br>Why'}`;
  document.getElementById('late').innerHTML = (S.events || []).slice(0, 8).map(e => `<span>${esc(clean(e.text))}</span>`).join('');
}

// ---------- the library: pregenerated pieces tailored to current events, never repeating soon ----------
// herald/library/*.json holds hundreds of templates with {slots} and "when" conditions. Every entry printed is
// reported to /seen, and picks always prefer the least-recently printed entry, with topical ones first.
let LIB = {}, SEEN = {}, issueUsed = new Set();
const NEWSY = /\{(mineral|masterwork|masterwright|promoted|post|deadname|moodname)\}/;
function markSeen(ids) {
  ids = [...new Set(ids)].filter(Boolean); if (!ids.length) return;
  const now = Date.now() / 1000 | 0; ids.forEach(i => SEEN[i] = now);
  fetch('/seen', {method: 'POST', body: JSON.stringify({ids})}).catch(() => {});
}
function newsSlots() {
  const o = {}, evs = (S.events || []).map(e => clean(e.text)), big = S.big || [];
  for (const t of evs) {
    let m;
    if (!o.mineral && (m = t.match(/struck (.+?)!/))) o.mineral = m[1].replace(/^(some|an?) /, '');
    if (!o.masterwork && (m = t.match(/^(.+?) has created an? masterpiece (.+?)!?$/))) { o.masterwright = cap(m[1]); o.masterwork = m[2].replace(/\[\d+\]/, '').trim(); }
    if (!o.promoted && (m = t.match(/^(.+?) has become an? (.+?)\.$/))) { o.promoted = cap(m[1]); o.post = m[2].toLowerCase(); }
  }
  for (const b of big) {
    const t = clean(b.text), nm = (t.match(/^([^,]+),/) || [])[1];
    if (b.type === 'CITIZEN_DEATH' && nm && !o.deadname) o.deadname = cap(nm);
    if (/MOOD/.test(b.type) && nm && !o.moodname) o.moodname = cap(nm);
    if (/MASTERPIECE/.test(b.type) && !o.masterwork) { const m = t.match(/^(.+?) has created an? masterpiece (.+?)!?$/); if (m) { o.masterwright = cap(m[1]); o.masterwork = m[2].replace(/\[\d+\]/, '').trim(); } }
    if (/STRUCK/.test(b.type) && !o.mineral) { const m = t.match(/struck (.+?)!/); if (m) o.mineral = m[1]; }
    if (/MIGRANT/.test(b.type)) o._migrants = 1;
    if (/CARAVAN/.test(b.type)) o._caravan = 1;
  }
  return o;
}
function context(r) {
  const c = (K && K.stocks) || {}, an_ = (K && K.animals) || {}, f = S.fort || {}, wx = S.weather || {};
  const names = [...new Set([...(S.names || []), ...citizens()])].map(n => cap(clean(n))).filter(n => n.trim());
  const ppl = shuffle(r, names), art = H.artifacts && H.artifacts.length ? pick(r, H.artifacts) : null;
  const top = Object.entries(an_).sort((a, b) => b[1] - a[1])[0];
  const n = v => v ? Number(v).toLocaleString() : null;
  const news = newsSlots();
  const sl = {
    fort: f.name, pop: f.population, year: f.year, month: f.month, season: wx.season, weather: wx.kind ? forecastOf(wx).toLowerCase() : null,
    world: clean((W && W.world) || f.world || ''),
    drinks: n(c.drinks), meals: n(c.meals), plants: n(c.plants), seeds: n(c.seeds), stone: n(c.stone), wood: n(c.wood), bars: n(c.bars),
    gems: n(c.gems), cloth: n(c.cloth), thread: n(c.thread), blocks: n(c.blocks),
    herd: n(Object.values(an_).reduce((a, b) => a + b, 0)), dogs: n(an_.dogs), cats: n(an_.cats),
    topanimal: top && top[1] > 1 ? top[0] : null, topanimal_n: top && top[1] > 1 ? top[1] : null, farms: n(K && K.farms),
    citizen: ppl[0], citizen2: ppl[1], citizen_first: ppl[2] ? ppl[2].split(' ')[0] : null,
    artifact: art ? clean(art.name) : null, artifact_item: art ? clean(art.item).replace(/^[-\s«]+|[-\s»]+$/g, '').replace(/[«»]/g, '') : null,
    ...news,
  };
  const se = (wx.season || '').toLowerCase(), g = k => c[k] || 0;
  const conds = new Set(Object.entries({
    no_meat: !g('meat') && !g('fish'), drinks_high: g('drinks') > 1000, drinks_low: K && K.stocks && g('drinks') < 100,
    rain: wx.kind === 'rain', snow: wx.kind === 'snow', clear: wx.kind === 'clear', pop_big: f.population > 30, pop_small: f.population < 15,
    dogs_many: (an_.dogs || 0) > 5, cats: (an_.cats || 0) > 0, farms_many: (K && K.farms) > 10, stone_glut: g('stone') > 400,
    wood_low: K && K.stocks && g('wood') < 20, gems: g('gems') > 0, recent_death: !!news.deadname, recent_mood: !!news.moodname,
    recent_masterpiece: !!news.masterwork, recent_strike: !!news.mineral, recent_promotion: !!news.promoted,
    recent_migrants: !!news._migrants, recent_caravan: !!news._caravan,
    spring: se.includes('spring'), summer: se.includes('summer'), autumn: se.includes('autumn'), winter: se.includes('winter'),
  }).filter(([, v]) => v).map(([k]) => k));
  return {sl, conds};
}
// fill every string in an entry; null if any slot is missing (that entry just isn't eligible right now)
function fillT(s, sl) {
  let ok = true;
  const out = s.replace(/\{(\w+)\}/g, (m, k) => { const v = sl[k]; if (v == null || v === '') { ok = false; return m; } return String(v); });
  return ok ? out : null;
}
function fillE(e, sl) {
  const walk = v => typeof v === 'string' ? fillT(v, sl) : Array.isArray(v) ? v.map(walk) : v && typeof v === 'object' ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, k === 'id' || k === 'when' ? x : walk(x)])) : v;
  const out = walk(e), bad = JSON.stringify(out).includes('null');   // a failed fill leaves null somewhere
  return bad ? null : out;
}
// least-recently printed first; topical entries get a day's head start; never twice in one issue
function choose(list, ctx, r, n = 1, extra = {}) {
  const sl = {...ctx.sl, ...extra}, now = Date.now() / 1000;
  const cands = [];
  for (const e of list || []) {
    if (!e || !e.id || issueUsed.has(e.id)) continue;
    if ((e.when || []).some(c => !ctx.conds.has(c))) continue;
    const f = fillE(e, sl); if (!f) continue;
    const topical = (e.when && e.when.length) || NEWSY.test(JSON.stringify(e));
    cands.push({f, score: (SEEN[e.id] || 0) - (topical ? 86400 : 0) + r() * 1800});
  }
  cands.sort((a, b) => a.score - b.score);
  const got = cands.slice(0, n).map(c => c.f);
  got.forEach(g => issueUsed.add(g.id));
  return got;
}
const choose1 = (list, ctx, r, extra) => choose(list, ctx, r, 1, extra)[0];
const T = x => x ? (typeof x === 'string' ? x : x.text) : '';

// ---------- card: society pages (interview) ----------
function mood(stress) {
  const label = stress < -20000 ? 'ecstatic' : stress < -5000 ? 'happy' : stress < 10000 ? 'content'
              : stress < 25000 ? 'stressed' : stress < 50000 ? 'very stressed' : 'near breaking';
  const pct = Math.max(4, Math.min(100, 50 - stress / 2000));
  const color = stress < 10000 ? 'var(--green)' : stress < 25000 ? 'var(--accent)' : 'var(--red)';
  return {label, pct, color};
}
const GOOD = new Set(['BLISS','SATISFACTION','EUPHORIA','JOY','CONTENTMENT','PLEASURE','DELIGHT','ELATION','HAPPINESS','FONDNESS',
  'GRATITUDE','PRIDE','RELIEF','ENJOYMENT','AMUSEMENT','LOVE','TRIUMPH','HOPE','ADORATION','EAGERNESS','ENTHUSIASM','EXHILARATION',
  'FREEDOM','INTEREST','LUST','OPTIMISM','RAPTURE','THRILL','ACCEPTANCE','AROUSAL','ASTONISHMENT','CARING','COMPASSION','SYMPATHY']);
const ADJ = {BLISS:'blissful',SATISFACTION:'satisfied',EUPHORIA:'euphoric',JOY:'joyful',CONTENTMENT:'content',PLEASURE:'pleased',DELIGHT:'delighted',
  ELATION:'elated',FONDNESS:'fond',GRATITUDE:'grateful',PRIDE:'proud',RELIEF:'relieved',ENJOYMENT:'delighted',AMUSEMENT:'amused',
  DISGUST:'disgusted',UNEASINESS:'uneasy',BOREDOM:'bored',LONELINESS:'lonely',GRIEF:'grief-stricken',ANGER:'angry',ANNOYANCE:'annoyed',
  IRRITATION:'irritated',FEAR:'afraid',HORROR:'horrified',SADNESS:'sad',DESPAIR:'in despair',MISERY:'miserable',DISTRESS:'distressed',
  EMBARRASSMENT:'embarrassed',SHAME:'ashamed',GUILT:'guilty',FRUSTRATION:'frustrated',DISAPPOINTMENT:'disappointed',ANXIETY:'anxious',
  RESTLESSNESS:'restless',TERROR:'terrified',WORRY:'worried',DEJECTION:'dejected',NOSTALGIA:'nostalgic',FURY:'furious',RAGE:'enraged',
  SHOCK:'shocked',ALARM:'alarmed',GLOOM:'gloomy',HOPELESSNESS:'hopeless',MELANCHOLY:'melancholy',REGRET:'regretful',VEXATION:'vexed'};
const adj = e => ADJ[e] || String(e || 'something').toLowerCase();
// DF thought type (+ emotion) -> interview library category
const CATS = [
  [/^BedroomQuality/, 'bedroom'], [/SatisfiedAtWork|^Work/, 'work'], [/NeedsUnfulfilled/, t => t.emotion === 'BOREDOM' ? 'bored' : t.emotion === 'LONELINESS' ? 'lonely' : 'unmet_need'],
  [/Syndrome/, 'syndrome'], [/ImproveSkill|Skill/, 'skill'], [/Miasma/, 'miasma'], [/Death|Died|Killed|Corpse/, 'death'], [/Rain|Snow|Weather/, 'rain'],
  [/Sun|Sky|Cave/, 'sky'], [/Drink|Alcohol|Booze/, 'drink'], [/Dining|Table|Chair/, 'dining'], [/Eat|Meal|Food|Hunger|Ate/, 'food'], [/Sleep|Rest|Tired|Bed/, 'sleep'],
  [/Pray|Worship|Temple/, 'prayer'], [/Talk|Conversation|Comfort|Friend|Argu|Insult|Flatter/, 'talk'], [/Art|Craft|Masterpiece|Admire|Decor/, 'art'],
  [/Attack|Fight|Combat|Injur|Pain|Wound/, 'combat'], [/Ghost|Haunt/, 'ghost'], [/Train|Animal|Pet/, 'animals'], [/Trade|Caravan|Merchant/, 'trade'],
];
const catOf = t => { for (const [re, c] of CATS) if (re.test(t.about)) return typeof c === 'function' ? c(t) : c; return 'other'; };
const MOODKEY = {ecstatic: 'mood_ecstatic', happy: 'mood_happy', content: 'mood_content', stressed: 'mood_stressed', 'very stressed': 'mood_very_stressed', 'near breaking': 'mood_breaking'};
function cardDwarf() {
  const d = S.dwarf, IV = LIB; if (!d || !IV.answers) return null;
  const r = rng(Date.now() / 1000 | 0), ctx = context(r);
  const m = mood(d.stress);
  const prof = clean(d.profession).toLowerCase();
  const full = firstName(d.name), nick = (full.match(/"([^"]+)"/) || [])[1];
  const plain = full.replace(/\s*"[^"]*"\s*/, ' ').trim(), first = plain.split(' ')[0];
  const who = nick || first;
  const sk = d.skills || [], top = sk[0];
  const deity = (d.family || []).find(x => x.relation === 'DEITY');
  const kin = (d.family || []).filter(x => x.relation !== 'DEITY');
  const job = clean(d.job || '').toLowerCase(), idle = !job || /no job|idle/.test(job);
  const me = {dwarf: plain, first, nick: who, prof, age: d.age, job: idle ? null : job, deity: deity ? clean(deity.name) : null,
              skill: top ? top.name.toLowerCase() : null, level: top ? levels[Math.min(top.level, 15)].toLowerCase() : null, skill2: sk[1] ? sk[1].name.toLowerCase() : null};
  const A = IV.answers, Q = IV.questions || {}, used = [];
  const say = (list, extra = {}) => { const e = choose1(list, ctx, r, {...me, ...extra}); if (e) used.push(e.id); return e ? T(e) : null; };
  const ask = (k, extra) => say(Q[k], extra) || '...';

// ---------- card: weather & world (scrolling map) ----------
let mapImg = null, particles = [], mapAnim = null;
function tileColor(i) {

  if (e < 100) { const d = e / 100; return [96 + 40 * d, 128 + 30 * d, 138 + 20 * d]; }          // sea
  if (W.water && (W.water[i] & 2)) return [104, 140, 150];   // lake (the river flag is set on half the map on v53, so it's ignored)
  if (e >= 300) { const k = Math.min(1, (e - 300) / 100); return [138 + 70 * k, 128 + 72 * k, 112 + 80 * k]; } // mountains
  if (t < 10) return [228, 224, 214];                                                            // tundra/glacier
  if (r < 20) return [214, 194, 140];                                                            // desert

}
const MAP_W = 456, MAP_H = 300;
function buildMap() {

  c.width = W.w * s; c.height = W.h * s;

  for (let y = 0; y < W.h; y++) for (let x = 0; x < W.w; x++) {
    const col = tileColor(y * W.w + x);
    for (let dy = 0; dy < s; dy++) for (let dx = 0; dx < s; dx++) {

  const dist = st => Math.hypot(st.x - fx, st.y - fy);

    const x = st.x * s + s / 2, y = st.y * s + s / 2;
    if (st.type === 'DarkFortress') { g.fillStyle = '#7a1414'; g.beginPath(); g.moveTo(x, y - 4); g.lineTo(x + 4, y + 3); g.lineTo(x - 4, y + 3); g.fill(); }

  }
  const named = [...(W.sites || [])].filter(st => st.type !== 'ForestRetreat').sort((a, b) => dist(a) - dist(b));
  const pk = [...named.filter(st => st.type !== 'DarkFortress').slice(0, 6), ...named.filter(st => st.type === 'DarkFortress').slice(0, 3)];
  const boxes = [[fx * s - 60, fy * s - 30, 120, 22]];

  for (const st of pk) {
    const name = clean(st.name), wpx = g.measureText(name).width + 6;
    const x = st.x * s + s / 2, y = st.y * s + s / 2 - 7, box = [x - wpx / 2, y - 12, wpx, 15];
    if (boxes.some(b => box[0] < b[0] + b[2] && b[0] < box[0] + box[2] && box[1] < b[1] + b[3] && b[1] < box[1] + box[3])) continue;
    boxes.push(box);
    g.fillStyle = 'rgba(239,228,204,.75)'; g.fillRect(...box);
    g.fillStyle = st.type === 'DarkFortress' ? '#7a1414' : '#2b2218';

}
function cardMap() {
  if (!W || !W.w) return null;
  const wx = S.weather || {kind: 'clear', amount: 0, season: ''};
  const fc = forecastOf(wx);
  return `<div class="kicker"><span>Weather &amp; World</span><span>${esc(clean(W.world || ''))}</span></div>
    <div class="headline">${fc.toUpperCase()} OVER ${esc((S.fort ? S.fort.name : '').toUpperCase())}</div>
    <div class="mapwrap"><canvas id="map" width="${MAP_W}" height="${MAP_H}"></canvas></div>
    <div class="forecast"><span>Today: <b>${fc}</b></span><span class="dim">▲ dark fortress · ■ town · ● retreat</span></div>`;
}
function startMap() {
  const cv = document.getElementById('map'); if (!cv || !mapImg) return;
  const g = cv.getContext('2d'), s = mapImg.scale;
  const fx = W.fort ? W.fort.x * s : mapImg.width / 2, fy = W.fort ? W.fort.y * s : mapImg.height / 2;
  const wx = S.weather || {kind: 'clear', amount: 0};
  const n = wx.kind === 'clear' ? 0 : Math.round(40 + 160 * wx.amount);
  particles = Array.from({length: n}, () => ({x: Math.random() * cv.width, y: Math.random() * cv.height, v: .5 + Math.random()}));
  const t0 = performance.now();
  cancelAnimationFrame(mapAnim);
  const frame = now => {
    const t = (now - t0) / 1000;
    const r = Math.min(mapImg.width, mapImg.height) * 0.33 * Math.sin(Math.min(1, t / 8) * Math.PI / 2);
    let cx = fx + Math.cos(t / 6) * r, cy = fy + Math.sin(t / 9) * r * 0.8;
    cx = Math.max(cv.width / 2, Math.min(mapImg.width - cv.width / 2, cx));
    cy = Math.max(cv.height / 2, Math.min(mapImg.height - cv.height / 2, cy));
    const ox = cx - cv.width / 2, oy = cy - cv.height / 2;
    g.drawImage(mapImg, ox, oy, cv.width, cv.height, 0, 0, cv.width, cv.height);
    const mx = fx - ox + s / 2, my = fy - oy + s / 2, pulse = 6 + 3 * Math.sin(t * 3);
    g.strokeStyle = '#8f2a1c'; g.lineWidth = 2; g.beginPath(); g.arc(mx, my, pulse, 0, 7); g.stroke();
    g.fillStyle = '#8f2a1c'; g.font = 'bold 13px Georgia'; g.textAlign = 'center'; g.fillText('★ ' + (W.fort ? W.fort.name : ''), mx, my - 12);
    for (const p of particles) {
      if (wx.kind === 'snow') { p.y += p.v * .8; p.x += Math.sin(t + p.v * 9) * .4; g.fillStyle = 'rgba(255,255,255,.9)'; g.beginPath(); g.arc(p.x, p.y, 1.2 + p.v, 0, 7); g.fill(); }
      else { p.y += p.v * 7; p.x -= p.v * 1.5; g.strokeStyle = 'rgba(70,90,120,.55)'; g.lineWidth = 1; g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(p.x + 2, p.y - 8); g.stroke(); }
      if (p.y > cv.height) { p.y = -5; p.x = Math.random() * (cv.width + 40); }
    }
    const v = g.createRadialGradient(cv.width / 2, cv.height / 2, cv.height * .35, cv.width / 2, cv.height / 2, cv.width * .7);
    v.addColorStop(0, 'rgba(239,228,204,0)'); v.addColorStop(1, 'rgba(120,90,40,.35)');
    g.fillStyle = v; g.fillRect(0, 0, cv.width, cv.height);
    mapAnim = requestAnimationFrame(frame);
  };
  mapAnim = requestAnimationFrame(frame);
}

    barrel(x, y, s = 1) { S.poly([[x - 8 * s, y - 22 * s], [x + 8 * s, y - 22 * s], [x + 10 * s, y - 11 * s], [x + 8 * s, y], [x - 8 * s, y], [x - 10 * s, y - 11 * s]]); S.line(x - 10 * s, y - 11 * s, x + 10 * s, y - 11 * s); },
    beast(x, y, s = 1) {
      S.poly([[x - 50 * s, y], [x - 54 * s, y - 40 * s], [x - 30 * s, y - 70 * s], [x + 10 * s, y - 76 * s], [x + 44 * s, y - 56 * s], [x + 52 * s, y - 20 * s], [x + 40 * s, y]], true);
      S.poly([[x - 30 * s, y - 68 * s], [x - 40 * s, y - 90 * s], [x - 20 * s, y - 72 * s]]); S.poly([[x + 4 * s, y - 75 * s], [x + 6 * s, y - 98 * s], [x + 18 * s, y - 72 * s]]);
      out.push(`<circle cx="${x - 14 * s}" cy="${y - 52 * s}" r="${4 * s}" fill="#fff8e8" stroke="#241c13"/><circle cx="${x + 8 * s}" cy="${y - 54 * s}" r="${4 * s}" fill="#fff8e8" stroke="#241c13"/>`);
      const ty = y - 32 * s; S.line(x - 26 * s, ty, x + 28 * s, ty);
      for (let i = 0; i < 6; i++) { const tx = x - 22 * s + i * 9 * s; S.poly([[tx, ty], [tx + 4 * s, ty + 8 * s], [tx + 8 * s, ty]]); }
    },
    ghost(x, y, s = 1) { S.poly([...ring(x, y - 40 * s, 16 * s, 16 * s, 8, Math.PI, Math.PI * 2), [x + 16 * s, y], [x + 8 * s, y - 6 * s], [x, y], [x - 8 * s, y - 6 * s], [x - 16 * s, y]], '#fff8e8'); out.push(`<circle cx="${x - 5 * s}" cy="${y - 42 * s}" r="${2.5 * s}" fill="#241c13"/><circle cx="${x + 5 * s}" cy="${y - 42 * s}" r="${2.5 * s}" fill="#241c13"/>`); S.circle(x, y - 32 * s, 3 * s); },
    heart(x, y, s = 1) { S.poly([[x, y + 10 * s], [x - 12 * s, y - 2 * s], [x - 10 * s, y - 10 * s], [x - 4 * s, y - 12 * s], [x, y - 6 * s], [x + 4 * s, y - 12 * s], [x + 10 * s, y - 10 * s], [x + 12 * s, y - 2 * s]], true); },
    baby(x, y, s = 1) { S.circle(x, y - 14 * s, 13 * s, false, 9 * s); S.circle(x - 12 * s, y - 20 * s, 7 * s); S.poly([[x - 17 * s, y - 16 * s], [x - 7 * s, y - 16 * s], [x - 12 * s, y - 4 * s]], true); },
    workshop(x, y, s = 1) { S.poly([[x - 30 * s, y], [x - 30 * s, y - 36 * s], [x + 30 * s, y - 36 * s], [x + 30 * s, y]]); S.poly([[x - 36 * s, y - 36 * s], [x, y - 54 * s], [x + 36 * s, y - 36 * s]], true); S.poly([[x - 8 * s, y], [x - 8 * s, y - 20 * s], [x + 8 * s, y - 20 * s], [x + 8 * s, y]], '#241c13'); },
    rocks(x, y, n = 6) { for (let i = 0; i < n; i++) { const rx = x + (r() - .5) * 70, ry = y + r() * 50; S.circle(rx, ry, 5 + r() * 6, true); S.line(rx + 6, ry - 10, rx + 10, ry - 18); } },
    wall(x, y, w2, h2) { S.poly([[x, y], [x, y - h2], [x + w2, y - h2], [x + w2, y]], true); for (let i = 0; i <= w2 - 10; i += 14) S.poly([[x + i, y - h2], [x + i, y - h2 - 8], [x + i + 8, y - h2 - 8], [x + i + 8, y - h2]]); },
    motion(x, y, n = 3) { for (let i = 0; i < n; i++) S.line(x, y + i * 7, x - 16, y + i * 7 + 2); },
    bubble(x, y, t) { const wb = Math.max(22, t.length * 6.5); S.circle(x + wb / 2, y, wb / 2 + 4, '#fff8e8', 10); S.line(x + 6, y + 9, x, y + 20); S.text(x + wb / 2, y + 4, t, 11); },
    svg: () => `<svg viewBox="0 0 ${w} ${h}" width="100%" style="display:block"><defs><pattern id="${id}" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(${30 + r() * 30})"><line x1="0" y1="0" x2="0" y2="5" stroke="#241c13" stroke-width="1.1" opacity=".5"/></pattern></defs>${out.join('')}</svg>`,
  };
  return S;
}
// event kind -> scene, breaking headline, sketch caption, report text. `who` is the first name in the announcement.
const KINDS = [
  {re: /SIEGE|NIGHT_ATTACK|AMBUSH|vile force/i, k: 'siege', head: 'ENEMIES AT THE GATES', cap: 'Goblins, as described to our artist by a dwarf who ran past screaming.',
   rep: 'Armed figures have been sighted outside the fortress. The militia is advised to do its job. Everyone else is advised to stand behind the militia.',
   draw: S => { S.ground(128); S.wall(150, 128, 80, 50); S.dwarf(190, 70, .8, {axe: true}); [30, 70, 110].forEach(x => S.goblin(x, 128, .9)); S.label(70, 22, 40, 48, 'GOBLINS (PROBABLY)'); }},
  {re: /MEGABEAST|WEREBEAST|BEAST_AMBUSH/, k: 'beast', head: 'MONSTER SIGHTED, CITIZENS "QUITE ALARMED"', cap: 'Artist\'s impression. Actual beast may be larger. Artist declined to get closer.',
   rep: 'A creature of terrible size has come to call. Experts recommend not being where it is.',
   draw: S => { S.ground(128); S.beast(80, 128, 1); S.dwarf(200, 128, .7, {armsUp: true}); S.motion(222, 92); S.label(190, 22, 120, 50, 'VERY BIG'); }},
  {re: /CITIZEN_DEATH/, k: 'death', head: 'FORTRESS MOURNS', cap: 'Mourners at the graveside. The artist apologises for the hands.',
   rep: 'A citizen has been lost. The Herald extends its condolences, and reminds readers that the coffin-maker is accepting orders.',
   draw: S => { S.ground(128); S.coffin(120, 128, 1.3); S.dwarf(55, 128, 1, {sad: true, tears: true}); S.dwarf(185, 128, 1, {sad: true, tears: true}); S.text(120, 70, 'R.I.P.', 14); }},
  {re: /PET_DEATH/, k: 'pet', head: 'BELOVED PET PASSES', cap: 'A small coffin for a good boy, or girl, or cat. The artist was not told which.',
   rep: 'A fortress animal has died. It was, by all accounts, a good one.',
   draw: S => { S.ground(128); S.coffin(120, 128, .7); S.dwarf(70, 128, .9, {sad: true, tears: true}); S.label(185, 50, 132, 100, 'GOOD BOY'); }},
  {re: /BERSERK|TANTRUM/, k: 'berserk', head: 'TANTRUM IN THE HALLS', cap: 'The incident, reconstructed. The mug did not survive.',
   rep: 'A citizen has lost their temper in a manner the Herald can only describe as thorough. Furniture is advised to stay out of reach.',
   draw: S => { S.ground(128); S.dwarf(110, 128, 1.1, {armsUp: true, mug: true}); S.motion(80, 70, 4); S.text(170, 50, '!!!', 26); S.barrel(200, 128, 1); S.text(40, 40, '#@%!', 16, 'middle', -12); }},
  {re: /STRANGE_MOOD|ARTIFACT_BEGUN|MOOD_BUILDING/, k: 'mood', head: 'CITIZEN "TAKEN BY A MOOD"', cap: 'Our subject, staring at a workshop. This went on for hours.',
   rep: 'A citizen has withdrawn from society and claimed a workshop. Neighbours report muttering, sketching and demands for materials nobody has.',
   draw: S => { S.ground(128); S.workshop(165, 128, 1.1); S.dwarf(70, 128, 1, {bubble: '?!'}); S.label(70, 18, 150, 66, 'THE WORKSHOP'); }},
  {re: /MADE_ARTIFACT|NAMED_ARTIFACT/, k: 'artifact', head: 'LEGENDARY ARTIFACT CREATED', cap: 'The artifact, as glimpsed from the back of the crowd. Not to scale.',
   rep: 'A work for the ages has been completed. Scholars agree it is very shiny.',
   draw: S => { S.ground(128); S.dwarf(120, 128, 1.1, {armsUp: true}); S.gem(120, 30, 1); S.dwarf(45, 128, .8); S.dwarf(195, 128, .8); S.text(45, 50, 'ooh', 11); S.text(195, 50, 'aah', 11); }},
  {re: /MASTERPIECE|MASTERFUL/, k: 'master', head: 'MASTERPIECE!', cap: 'The masterpiece. The artist insists it looked like this.',
   rep: 'Another masterpiece leaves the workshops. The craftsdwarf would like it known they are available for interviews.',
   draw: S => { S.ground(128); S.dwarf(90, 128, 1.1, {armsUp: true}); S.barrel(170, 128, 1.4); S.sparkles(170, 95, 22, 6); S.label(200, 30, 175, 90, 'MASTERPIECE (TRUST US)'); }},
  {re: /STRUCK|FEATURE_DISCOVERY/, k: 'strike', head: 'MINERS STRIKE IT RICH', cap: 'The find, artist\'s impression. Gem shown actual size, according to the miner.',
   rep: 'Miners report a significant discovery deep in the rock. They have been asked to stop yelling about it.',
   draw: S => { S.ground(128); S.dwarf(70, 128, 1.1, {pick: true, armsUp: true}); S.gem(170, 85, 1.6); S.label(200, 22, 175, 58, 'ROCK (GOOD)'); }},
  {re: /MIGRANT/, k: 'migrants', head: 'MIGRANTS ARRIVE', cap: 'The new arrivals. All beards, no plans.',
   rep: 'A fresh wave of settlers has arrived at the gates, carrying nothing useful and asking where the beds are.',
   draw: S => { S.ground(128); S.wagon(120, 128, 1.4, 5); S.label(205, 20, 150, 60, 'MORE OF THEM'); S.dwarf(30, 128, .7); }},
  {re: /CARAVAN/, k: 'caravan', head: 'CARAVAN ARRIVES, TRADE BOOMS', cap: 'The merchants. Their prices, regrettably, could not be drawn.',
   rep: 'Merchants have reached the trade depot. Haggling is expected to be fierce, dishonest and very long.',
   draw: S => { S.ground(128); S.wagon(110, 128, 1.3, 1); S.barrel(190, 128, 1); S.barrel(212, 128, .8); S.label(40, 24, 80, 70, 'WARES'); }},
  {re: /BIRTH_CITIZEN/, k: 'birth', head: 'A CHILD IS BORN', cap: 'Mother and baby doing well. The beard, we are told, is normal.',
   rep: 'The fortress welcomes its newest citizen, who has already been assigned a hauling job.',
   draw: S => { S.ground(128); S.dwarf(80, 128, 1.1); S.baby(165, 110, 1.3); S.label(210, 30, 160, 92, 'ALREADY BEARDED'); }},
  {re: /MARRIAGE/, k: 'marriage', head: 'WEDDING BELLS BENEATH THE MOUNTAIN', cap: 'The happy couple. The artist was not invited and drew this from memory.',
   rep: 'Two citizens have married. No party was held, because nobody planned one.',
   draw: S => { S.ground(128); S.dwarf(85, 128, 1); S.dwarf(155, 128, 1); S.heart(120, 40, 1.3); }},
  {re: /GHOST/, k: 'ghost', head: 'GHOST TERRORISES HALLS', cap: 'The apparition, drawn by a witness with their eyes mostly closed.',
   rep: 'The restless dead walk among us. The Herald reminds readers that slabs and coffins are cheaper than therapy.',
   draw: S => { S.ground(128); S.ghost(80, 110, 1.4); S.dwarf(185, 128, .9, {armsUp: true}); S.motion(210, 92); S.text(80, 30, 'boo', 14); }},
  {re: /CAVE_COLLAPSE/, k: 'collapse', head: 'CAVE-IN!', cap: 'The collapse, reconstructed using rocks.',
   rep: 'Part of the ceiling has relocated to the floor. Engineers call it "an oversight".',
   draw: S => { S.ground(128); S.rocks(120, 40, 8); S.dwarf(120, 128, .9, {armsUp: true}); S.text(190, 40, 'OOF', 16); }},
  {re: /SOLDIER_BECOMES_MASTER/, k: 'soldier', head: 'SOLDIER ACHIEVES MASTERY', cap: 'A master of arms, shown here being terrifying.',
   rep: 'A member of the militia has reached legendary skill. Goblins are advised to take the long way round.',
   draw: S => { S.ground(128); S.dwarf(120, 128, 1.3, {axe: true}); S.sparkles(120, 50, 35, 6); }},
];
const kindOf = ev => KINDS.find(k => k.re.test(ev.type || '') || (k.k === 'siege' && k.re.test(ev.text || '')));
const evWho = ev => { const m = clean(ev.text).match(/^([A-Z][^\s,]+ [A-Z][^\s,]+)/); return m ? cap(m[1]) : null; };
const evText = {};
function eventText(ev, k) {   // headline/caption/report/arrow label for one event, picked once and reused
  if (evText[ev.id]) return evText[ev.id];
  const L = (LIB.kinds || {})[k.k] || {}, r = rng(ev.id * 17 + 3), ctx = context(r), ids = [];
  const who = evWho(ev), extra = {who, first: who ? who.split(' ')[0] : null, event: clean(ev.text)};
  const pk = (list, dflt) => { const e = choose1(list, ctx, r, extra); if (e) ids.push(e.id); return e ? T(e) : dflt; };
  const t = {head: pk(L.heads, k.head), cap: pk(L.caps, k.cap), rep: pk(L.reps, k.rep), label: pk(L.labels, null), kicker: pk(L.kickers, '')};
  markSeen(ids);
  return evText[ev.id] = t;
}
function drawEvent(ev, w, h) {
  const k = kindOf(ev); if (!k) return null;
  const t = eventText(ev, k), sk = Sketch((ev.id || 1) * 31 + 7, w, h);
  sk.labelText = t.label; k.draw(sk);
  return {k, t, svg: sk.svg()};
}
function portrait(d) {   // courtroom-sketch style portrait of the interviewee
  const sk = Sketch(d.id * 13 + 5, 240, 140), m = mood(d.stress);
  sk.ground(132); sk.dwarf(120, 132, 1.9, {sad: m.label.includes('stress') || m.label === 'near breaking', pick: /mine|dig/i.test(d.job + ((d.skills || [])[0] || {}).name)});
  return sk.svg();
}

// ---------- card: breaking news (interrupts the rotation when a big event lands) ----------
let breakingQ = [], seenBig = null, breakingOn = false;
function cardBreaking(ev) {
  const res = drawEvent(ev, 240, 140); if (!res) return null;
  return `<div class="kicker"><span>★ Breaking News ★</span><span>Extra! Extra!</span></div>
    <div class="headline" style="font-size:25px;text-align:center">${esc(res.t.head)}</div>
    <div class="mapwrap" style="background:#f6eedb;padding:2px">${res.svg}</div>
    <div class="deck" style="font-size:11px;text-align:center;margin:2px 0 4px">${esc(res.t.cap)}</div>
    <p class="body just dropcap">${esc(clean(ev.text))} ${esc(res.t.rep)} ${esc(res.t.kicker)}</p>`;
}
function checkBig() {
  const big = S.big || [];
  if (!seenBig) { seenBig = new Set(big.map(e => e.id)); return; }      // don't replay old news on page load
  for (const e of [...big].reverse()) if (!seenBig.has(e.id)) { seenBig.add(e.id); if (kindOf(e)) breakingQ.push(e); }
  if (breakingQ.length && !breakingOn) nextCard();
}

// ---------- below the fold: ads, editorials, letters, classifieds ----------
function citizens() {
  const names = new Set();
  for (const e of S.events || []) { const m = clean(e.text).match(/^([A-Z][^\s,]+ [A-Z][^\s,]+) (has|is|was|cancels)/); if (m) names.add(m[1]); }
  if (S.dwarf) names.add(firstName(S.dwarf.name).replace(/\s*"[^"]*"\s*/, ' ').trim());
  return [...names];
}
function fillers(r) {
  const ctx = context(r), out = [];
  const put = (ids, html) => out.push({ids: [].concat(ids), html});
  // display ads
  for (const a of choose(LIB.ads, ctx, r, 7))
    put(a.id, `<div class="item ad${a.inv ? ' inv' : ''}">${(a.lines || []).map(([st, tx]) => `<div class="${esc(st)}">${esc(tx)}</div>`).join('')}</div>`);
  // editorials / columns
  for (const e of choose(LIB.editorials, ctx, r, 3))
    put(e.id, `<div class="item"><div class="kick">${esc(e.kick || 'Opinion')}</div><h3>${esc(e.head)}</h3><p class="just dropcap">${esc(e.body)}</p>${e.by ? `<div class="by">— ${esc(e.by)}</div>` : ''}</div>`);
  // letters
  for (const l of choose(LIB.letters, ctx, r, 3))
    put(l.id, `<div class="item"><div class="kick">Letters to the Editor</div><p class="just"><i>Sir,</i> ${esc(l.body)}</p><div class="by">— ${esc(l.by)}</div></div>`);
  // classifieds block
  const cls = choose(LIB.classifieds, ctx, r, 4);
  if (cls.length) put(cls.map(c => c.id), `<div class="item cls"><div class="kick">Classifieds</div>${cls.map(c => `<div><b>${esc(c.tag)}:</b> ${esc(c.text)}</div>`).join('')}</div>`);
  // almanac + proverb, trivia
  const al = choose1(LIB.almanac, ctx, r), pv = choose1(LIB.proverbs, ctx, r);
  if (al || pv) put([al && al.id, pv && pv.id], `<div class="item"><div class="kick">Almanac</div><p class="just">${al ? esc(T(al)) + ' ' : ''}${pv ? `Proverb of the day: <i>"${esc(T(pv))}"</i>` : ''}</p></div>`);
  const tv = choose1(LIB.trivia, ctx, r);
  if (tv) put(tv.id, `<div class="item"><div class="kick">On This Day</div><p class="just">${esc(T(tv))}</p></div>`);
  // our sketch artist: recent big events and a portrait of today's interviewee
  for (const ev of (S.big || []).filter(e => e.id !== breakingOn).slice(0, 2)) {
    const res = drawEvent(ev, 240, 140); if (!res) continue;
    put([], `<div class="item"><div class="kick">From Our Sketch Artist</div><h3>${esc(res.t.head)}</h3>${res.svg}<p class="just" style="font-style:italic;font-size:10px;margin-top:2px">${esc(clean(ev.text))} ${esc(res.t.cap)}</p></div>`);
  }
  if (S.dwarf) put([], `<div class="item"><div class="kick">Courtroom Sketch</div>${portrait(S.dwarf)}<p style="font-style:italic;font-size:10px;text-align:center">${esc(firstName(S.dwarf.name))}, as seen by our artist. Likeness not guaranteed.</p></div>`);
  // small notices go last: they plug the leftover gaps at the bottom of the columns
  const tiny = choose(LIB.notices, ctx, r, 8).map(nt => ({ids: [nt.id], html: `<div class="item ad tiny"><div class="eng">Notice</div>${esc(T(nt))}</div>`}));
  return [...shuffle(r, out), ...tiny];
}
function fillFold() {
  // pack items into the two columns, shortest column first; anything that would be cut off is skipped
  const A = document.getElementById('colA'), B = document.getElementById('colB');
  A.innerHTML = ''; B.innerHTML = '';
  const limit = A.clientHeight; if (limit < 30) return;
  const r = rng(Date.now() / 1000 | 0), placed = [];
  const used = col => col.lastElementChild ? col.lastElementChild.offsetTop + col.lastElementChild.offsetHeight : 0;
  for (const it of fillers(r)) {
    const first = used(A) <= used(B) ? A : B;
    for (const target of [first, first === A ? B : A]) {
      const t = document.createElement('template'); t.innerHTML = it.html.trim();
      const el = t.content.firstElementChild; target.appendChild(el);
      if (el.offsetTop + el.offsetHeight <= limit) { placed.push(...it.ids); break; }
      el.remove();
    }
  }
  markSeen(placed);   // only what actually made it into print counts as used
}

// ---------- rotation ----------
const CARDS = [
  {fn: cardDwarf, secs: 30}, {fn: cardMap, secs: 30, after: startMap}, {fn: cardAg, secs: 20}, {fn: cardArchive, secs: 20},
];
const params = new URLSearchParams(location.search);   // ?card=N&hold to pin one card (testing)
let cardIdx = params.has('card') ? Number(params.get('card')) - 2 : -1, cardTimer = null;
function showCard(html, after) {
  const el = document.getElementById('card');
  el.innerHTML = html; el.classList.remove('fadein'); void el.offsetWidth; el.classList.add('fadein');
  if (after) after(); else cancelAnimationFrame(mapAnim);
  fillFold();
}
function newIssue() {
  issueUsed = new Set();
  const r = rng(Date.now() / 1000 | 0), ear = choose1(LIB.ears, context(r), r);
  if (ear) { document.getElementById('ear-r').innerHTML = `Price<b>1☼</b>${esc(T(ear))}`; markSeen([ear.id]); }
}
function nextCard() {
  newIssue();
  // big news jumps the queue: one Breaking card per new event, then the normal rotation resumes
  while (breakingQ.length) {
    const ev = breakingQ.shift(), html = cardBreaking(ev);
    if (!html) continue;
    breakingOn = ev.id; showCard(html);
    document.getElementById('dots').innerHTML = '<span class="on" style="background:var(--red);border-color:var(--red)"></span>';
    clearTimeout(cardTimer); cardTimer = setTimeout(() => { breakingOn = false; nextCard(); }, 25000);
    return;
  }
  for (let tries = 0; tries < CARDS.length; tries++) {
    cardIdx = (cardIdx + 1) % CARDS.length;
    const c = CARDS[cardIdx], html = c.fn();
    if (!html) continue;
    showCard(html, c.after);
    document.getElementById('dots').innerHTML = CARDS.map((_, i) => `<span class="${i === cardIdx ? 'on' : ''}"></span>`).join('');
    clearTimeout(cardTimer);
    if (!params.has('hold')) cardTimer = setTimeout(nextCard, c.secs * 1000);
    return;
  }
  clearTimeout(cardTimer); cardTimer = setTimeout(nextCard, 3000);
}

// ---------- data ----------
const get = async u => (await fetch(u, {cache: 'no-store'})).json();
async function pollState() {
  try { S = await get('/state.json'); } catch (e) { return; }
  // ?breaking=SIEGE (or any announcement type) fakes a fresh big event, for testing the artwork
  if (params.has('breaking') && seenBig) (S.big = S.big || []).unshift({id: 999999, type: params.get('breaking'), text: params.get('text') || 'Urist McTest has done something newsworthy.', year: 105});
  masthead(); checkBig();
}
async function pollStocks() {
  try { const k = await get('/stocks.json'); if (k && k.stocks) { if (K && K.stocks) prevStocks = K.stocks; K = k; } } catch (e) {}
}
async function loadLib() {
  try { const l = await get('/library.json'); if (l && Object.keys(l).length) LIB = l; } catch (e) {}
  try { SEEN = Object.assign(await get('/seen.json'), SEEN); } catch (e) {}
}
async function pollSlow() {
  loadLib();
  try { const h = await get('/history.json'); if (h.artifacts && h.artifacts.length) H = h; } catch (e) {}
  try { const w = await get('/world.json'); if (w && w.w && (!W || W.world !== w.world)) { W = w; buildMap(); } } catch (e) {}
}
(async () => {
  await Promise.all([pollState(), pollStocks(), pollSlow(), loadLib()]);
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  nextCard();
  setInterval(pollState, 3000); setInterval(pollStocks, 30000); setInterval(pollSlow, 120000);
})();
</script>
