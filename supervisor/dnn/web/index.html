<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>DNN - Dwarf News Network</title>
<link rel="stylesheet" href="dnn.css">
</head>
<body>
<div id="screen">
  <div id="bug"><span class="logo">DNN</span><span class="live">LIVE</span><span id="bugfort"></span></div>
  <div id="clock"><span id="fortdate"></span><span id="pop"></span></div>

  <div id="stage">
    <div id="vidwrap" class="layer"><img id="still" alt=""><div id="vidtag">LIVE</div><div id="nosignal" class="hidden"><div>DNN FIELD CAMERA<br><small>reconnecting to the fort...</small></div></div></div>
    <div id="studio" class="layer hidden"><div class="backdrop"><div class="wall"></div><div class="skyline"></div></div><div class="seat" id="studiohead"></div><div class="desk"><span>DNN</span></div></div>
    <div id="split" class="layer hidden"><div class="box" id="splitA"></div><div class="box" id="splitB"></div><div id="splitvs"></div></div>
    <div id="card" class="layer hidden"></div>
  </div>

  <div id="rail">
    <div id="pip"></div>
    <div id="board">
      <div class="bhead">NEXT ON DNN</div>
      <ol id="rundown"></ol>
      <div class="bhead">ALE INDEX</div>
      <div id="aleindex"></div>
    </div>
  </div>

  <div id="lower">
    <div id="slug"></div>
    <div id="head"></div>
    <div id="cap"><span id="who"></span><span id="line"></span></div>
  </div>
  <div id="ticker"><div class="tlabel">DNN</div><div class="tview"><div id="ttrack"></div></div><div id="tclock"></div></div>

  <div id="mute"></div>
  <div id="stinger" class="hidden"><div class="bar1"></div><div class="bar2"></div><div class="word">BREAKING NEWS</div></div>
</div>
<script src="dnn.js"></script>
</body>
</html>
